<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Longhand screenshots</title>
    <style>
      /* Only the window paints. The rest stays transparent, so the
         screenshot keeps the shadow's alpha. */
      html,
      body {
        background: transparent !important;
        margin: 0;
      }
    </style>
  </head>

    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
