# Dependency versions that may be less than 7 days old in a PR.
#
# The `cargo deny` CI job fails a PR that adds a version to Cargo.lock or
# package-lock.json that its registry published less than 7 days ago
# (scripts/check-dependency-age.ts). An entry here allows one exact
# version. Each entry has a reason, for example the advisory ID of the
# security fix that needs the version. Remove the entry when the version is
# 7 days old.
#
# [[exception]]
# ecosystem = "crate"   # "crate" (Cargo.lock) or "package" (package-lock.json)
# name = "rustls"
# version = "0.23.31"
# reason = "RUSTSEC-2026-0400: the fix is only in this version"

[[exception]]
ecosystem = "crate"
name = "rusqlite_migration"
version = "2.7.0"
reason = "RUSTSEC-2026-0459: bundled SQLite before 3.54.0. The only fix is libsqlite3-sys 0.39 through rusqlite 0.41, and 2.7.0 is the only rusqlite_migration release that accepts rusqlite 0.41. Remove after 2026-11-17."
