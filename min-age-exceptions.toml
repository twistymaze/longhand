# Dependency versions that may be less than 7 days old in a PR.
#
# The `cargo deny` CI job fails a PR that adds a version to Cargo.lock or
# package-lock.json that its registry published less than 7 days ago
# (scripts/check-dependency-age.ts). An entry here allows one exact
# version. Each entry has a reason, for example the advisory ID of the
# security fix that needs the version. Remove the entry when the version is
# 7 days old.
#
# [[exception]]
# ecosystem = "crate"   # "crate" (Cargo.lock) or "package" (package-lock.json)
# name = "rustls"
# version = "0.23.31"
# reason = "RUSTSEC-2026-0400: the fix is only in this version"

[[exception]]
ecosystem = "crate"
name = "rig-agent"
version = "0.47.0"
reason = "The summary agent loop runs on rig-agent's AgentRun. No advisory in OSV or RustSec on 2026-11-22. Remove after 2026-11-27."

[[exception]]
ecosystem = "crate"
name = "rig-memory"
version = "0.47.0"
reason = "The summary agent uses rig-memory's token estimates. No advisory in OSV or RustSec on 2026-11-22. Remove after 2026-11-27."

[[exception]]
ecosystem = "crate"
name = "pin-project"
version = "1.2.0"
reason = "Comes with rig-agent 0.47.0 through tracing-futures. No advisory in OSV or RustSec on 2026-11-22. Remove after 2026-11-26."

[[exception]]
ecosystem = "crate"
name = "pin-project-internal"
version = "1.2.0"
reason = "Comes with pin-project 1.2.0, which rig-agent 0.47.0 needs. No advisory in OSV or RustSec on 2026-11-22. Remove after 2026-11-26."
