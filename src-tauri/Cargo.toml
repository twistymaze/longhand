[package]
name = "longhand"
version = "0.1.0"
description = "Longhand"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
default-run = "longhand"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name, which
# otherwise collides on Windows (rust-lang/cargo#8519). Same as Handy.
name = "longhand_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-log = "2.10"
tauri-plugin-notification = "=2.7.0"
tauri-plugin-store = "2.5"
tauri-plugin-window-state = "2.5"
# Compiles to a no-op off macOS; registered everywhere so one capability file
# resolves on every platform (as Handy does).
tauri-plugin-macos-permissions = "2.3.0"

specta.workspace = true
specta-typescript.workspace = true
tauri-specta.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
sha2 = "0.10"
# The startup alerts (src/startup.rs). The same declaration as
# tauri-plugin-dialog, so no new crate enters Cargo.lock (KTD6).
rfd = { version = "0.16", default-features = false, features = ["common-controls-v6"] }
# The log file path for the alert after a build error (src/startup.rs).
# tauri uses the same crate for its paths.
dirs = "6"

audio = { path = "../crates/audio" }
audio-cpal = { path = "../crates/audio-cpal" }
audio-system = { path = "../crates/audio-system" }
models = { path = "../crates/models" }
power = { path = "../crates/power" }
sfx = { path = "../crates/sfx" }
recorder = { path = "../crates/recorder" }
secrets = { path = "../crates/secrets" }
asr = { path = "../crates/asr" }
# Named directly, not only through `asr`: cargo hands a `links` crate's build
# metadata (`DEP_TRANSCRIBE_CPP_RUNTIME_DIR`) to direct dependents alone, and
# build.rs needs it to stage the Windows runtime libraries. Features come from
# `asr`'s per-platform declarations.
transcribe-cpp = { version = "0.2.4", default-features = false }
pipeline = { path = "../crates/pipeline" }
library = { path = "../crates/library" }
session-save = { path = "../crates/session-save" }
summarize = { path = "../crates/summarize" }
diarize = { path = "../crates/diarize" }
session-core = { path = "../crates/session-core" }
# The shared settings and prompt files in the storage folder (KTD1).
shared-settings = { path = "../crates/shared-settings" }
supervisor = { path = "../crates/supervisor" }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
# The generation wrapper of a speaker stream (managers/capture.rs).
futures-util = "0.3"
thiserror.workspace = true
tokio = { version = "1", features = ["rt", "sync", "time"] }
tokio-util = "0.7"
uuid.workspace = true
trash = "5"
# The library watcher (managers/library.rs), as anarlog's notify plugin uses them.
notify = "8"
notify-debouncer-full = "0.5"
# The update manager (managers/updates.rs). The archive check uses the
# same signature crates as the updater plugin.
tauri-plugin-updater = "2.14"
semver = "1"
base64 = "0.22"
minisign-verify = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
diarize = { path = "../crates/diarize", features = ["coreml"] }
# The Settings window's zoom method (src/zoom.rs). tao already uses it.
objc2 = "0.6"
objc2-foundation = { version = "0.3.2", features = ["NSAppleEventManager", "NSAppleEventDescriptor", "objc2-core-services"] }
objc2-service-management = "0.3.2"
# Rich text on the clipboard without WebKit's added styles
# (src/commands/clipboard.rs). tao already uses it.
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSPasteboard"] }
# The recording widget panel (src/widget.rs), as in Handy. From crates.io,
# because deny.toml refuses other sources.
tauri-nspanel = "2.1"
# A window shows after tao's queued move and resize (src/window.rs). tao
# already uses it.
dispatch2 = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
tauri-plugin-autostart = "=2.7.0"
# Keeps the recording widget topmost and places it (src/widget.rs), as in
# Handy. The version that tauri already uses.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
# Reads the Windows text size, so the recording widget window grows with it
# (src/widget.rs), as in Handy. The version that Cargo.lock already has.
winreg = "0.55"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "=2.4.1"
tauri-plugin-single-instance = "2.5"

[dev-dependencies]
tempfile = "3"
# The log filter test (tests/log_filter.rs): fern is the logger that
# tauri-plugin-log builds, and the mock server of crates/summarize uses the
# tokio network types. Cargo.lock holds both crates already.
fern = "0.7"
tokio = { version = "1", features = ["macros", "net", "io-util", "rt-multi-thread"] }
