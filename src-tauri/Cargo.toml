[package]
name = "longhand"
version = "0.1.0"
description = "Longhand"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
default-run = "longhand"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name, which
# otherwise collides on Windows (rust-lang/cargo#8519). Same as Handy.
name = "longhand_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2.6"
tauri-plugin-log = "2.7"
tauri-plugin-notification = "=2.4.0"
tauri-plugin-store = "2.4"
# Compiles to a no-op off macOS; registered everywhere so one capability file
# resolves on every platform (as Handy does).
tauri-plugin-macos-permissions = "2.3.0"

specta.workspace = true
specta-typescript.workspace = true
tauri-specta.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
sha2 = "0.10"
# Free space on the destination volume, as anarlog measures it.
sysinfo = { version = "0.38", default-features = false, features = ["disk"] }

audio = { path = "../crates/audio" }
audio-cpal = { path = "../crates/audio-cpal" }
models = { path = "../crates/models" }
power = { path = "../crates/power" }
sfx = { path = "../crates/sfx" }
recorder = { path = "../crates/recorder" }
secrets = { path = "../crates/secrets" }
asr = { path = "../crates/asr" }
# Named directly, not only through `asr`: cargo hands a `links` crate's build
# metadata (`DEP_TRANSCRIBE_CPP_RUNTIME_DIR`) to direct dependents alone, and
# build.rs needs it to stage the Windows runtime libraries. Features come from
# `asr`'s per-platform declarations.
transcribe-cpp = { version = "0.2.3", default-features = false }
pipeline = { path = "../crates/pipeline" }
landing = { path = "../crates/landing" }
diarize = { path = "../crates/diarize" }
session-core = { path = "../crates/session-core" }
supervisor = { path = "../crates/supervisor" }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
thiserror.workspace = true
tokio = { version = "1", features = ["rt", "sync", "time"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "=2.3.2"
tauri-plugin-single-instance = "2.3.2"

[dev-dependencies]
tempfile = "3"
