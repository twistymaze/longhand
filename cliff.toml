# git-cliff configuration for Longhand releases.
# scripts/release-version.ts uses it to find whether a release is due and to
# get the next patch version. The script then raises the version for a `+` or
# `!` marker (docs/releases.md). Only squash-merged PR titles reach main, so
# each commit subject is one PR title.
#
# This file holds only the rules: which commits count, and the group of each
# commit. git-cliff gives the result as JSON (`--context`), and
# scripts/lib/changelog.ts writes the release notes and the changelog from it,
# so the two always agree. The `<!-- N -->` comment in a group sets the order
# of the headings.

[git]
# A `+` after the type or scope (`feat+:`, `feat(capture)+:`) marks a minor
# release. It is not Conventional Commit syntax, so remove it before parsing.
# Then the commit is a normal `feat`, and the notes do not show the `+`. The
# release script reads the marker from the original subject.
commit_preprocessors = [
  { pattern = '^(\w+(?:\([^)]*\))?)\+:', replace = "${1}:" },
]
conventional_commits = true
# Commits that are not Conventional Commits do not bump the version and do
# not appear in the notes.
filter_unconventional = true
# Commits whose type no parser matches do not bump and do not appear.
filter_commits = true
split_commits = false
# Only v<major>.<minor>.<patch> tags are release tags. Old preview tags do
# not match.
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
topo_order = false
sort_commits = "oldest"
# These types make a release. The other types are skipped, so they do not
# bump the version and do not appear in the notes. Their changes go out in
# the next release.
commit_parsers = [
  # The notes have three headings. `feat` is any gain that the user can see,
  # including improvements (CLAUDE.md), so its heading names both. Types with
  # the same group text go under one heading.
  { message = "^feat", group = "<!-- 0 -->New features and improvements" },
  { message = "^fix", group = "<!-- 1 -->Fixes" },
  { message = "^perf", group = "<!-- 1 -->Fixes" },
  { message = "^refactor", group = "<!-- 2 -->Other changes" },
  { message = "^revert", group = "<!-- 2 -->Other changes" },
  { message = "^build", group = "<!-- 2 -->Other changes" },
  { message = "^(docs|ci|test|chore|style)", skip = true },
]

[bump]
# Each release gets the next patch version. The release script raises it to
# a minor for a `feat+` subject, or to a major for a `!` subject.
bump_type = "patch"
# With no release tag, the first release is 1.0.0.
initial_tag = "v1.0.0"
