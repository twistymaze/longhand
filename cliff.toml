# git-cliff configuration for Longhand releases (KTD1).
# scripts/release-version.ts uses it to compute the next version and the
# release notes. Only squash-merged PR titles reach main, so each commit
# subject is one PR title.

[changelog]
# The release notes for one release. The release script removes the header
# and the footer with `--strip all`.
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}{{ commit.scope }}: {% endif %}{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
# Commits that are not Conventional Commits do not bump the version and do
# not appear in the notes.
filter_unconventional = true
# Commits whose type no parser matches do not bump and do not appear.
filter_commits = true
split_commits = false
# Only v<major>.<minor>.<patch> tags are release tags. Old preview tags do
# not match.
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
topo_order = false
sort_commits = "oldest"
# R9: these types make a release. The other types are skipped, so they do
# not bump the version and do not appear in the notes. Their changes go out
# in the next release.
commit_parsers = [
  # The notes have three headings. `fix` also includes small improvements
  # that are not bug fixes (CLAUDE.md), so its heading names both. Types with
  # the same group text go under one heading.
  { message = "^feat", group = "<!-- 0 -->New features" },
  { message = "^fix", group = "<!-- 1 -->Fixes and improvements" },
  { message = "^perf", group = "<!-- 1 -->Fixes and improvements" },
  { message = "^refactor", group = "<!-- 2 -->Other changes" },
  { message = "^revert", group = "<!-- 2 -->Other changes" },
  { message = "^build", group = "<!-- 2 -->Other changes" },
  { message = "^(docs|ci|test|chore|style)", skip = true },
]

[bump]
# The standard rules: `feat` gives a minor, `!` gives a major (R9, R11).
features_always_bump_minor = true
breaking_always_bump_major = true
# R8: with no release tag, the first release is 1.0.0 (KTD10).
initial_tag = "v1.0.0"
