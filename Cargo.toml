[workspace]
resolver = "3"
members = ["src-tauri", "crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
# Exact pins on the release candidates both reference clones use (KTD2).
specta = "=2.0.0-rc.22"
specta-typescript = "0.0.9"
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
# v4 gives a new prompt its id. v5 makes the id of a prompt file from its
# file name (shared-settings KTD5).
uuid = { version = "1", features = ["v4", "v5"] }

# No LTO and 16 codegen units, Rust's default release settings. Full LTO
# with one codegen unit made the last step of each release build take 8 to
# 11 minutes, and no compile cache can skip it. Without it, a release build
# takes 7 to 11 minutes less, the DMG is about 6% larger, and the Rust code
# can be a few percent slower. The heavy work runs in C/C++ and in the NeMo
# helper, which this setting does not change.
# (docs/solutions/performance-issues/sccache-compile-cache-experiment.md)
[profile.release]
lto = false
codegen-units = 16
strip = true
panic = "unwind"

# Optimize the crates where the pipeline tests spend their time (R12,
# KTD12). The test profile inherits these settings. `pipeline` makes the
# generic rubato, realfft and rustfft code of its resampler, so the override
# goes on `pipeline` and not on those crates. `earshot` and `vad` find speech,
# `recorder` writes the chunk files, and `sha2` hashes the audio files. An
# override on rubato, realfft, rustfft, num-complex, hound or opusic-sys gave
# no measured gain: libopus is a release build at all levels.
[profile.dev.package.pipeline]
opt-level = 3
[profile.dev.package.earshot]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.vad]
opt-level = 3
[profile.dev.package.recorder]
opt-level = 3
