# Gives the maintainer a GitHub notice for the upkeep tracking issue
# (docs/upkeep/README.md). The weekly routine acts as the maintainer's
# account, and GitHub does not notify a user about the user's own actions.
# So the routine adds the label "upkeep: needs review", and this workflow posts
# the notice as the GitHub Actions bot, then removes the label (plan KTD10).
#
# The repository variable UPKEEP_MAINTAINER holds the maintainer's login.

name: Upkeep notice

on:
  issues:
    types: [labeled]

permissions:
  issues: write

jobs:
  notify:
    name: Notify the maintainer
    if: >-
      github.event.label.name == 'upkeep: needs review' &&
      contains(github.event.issue.labels.*.name, 'upkeep')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Post the notice and remove the label
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          MAINTAINER: ${{ vars.UPKEEP_MAINTAINER }}
        run: |
          if [[ -z "$MAINTAINER" ]]; then
            echo "The repository variable UPKEEP_MAINTAINER is not set."
            exit 1
          fi
          gh api "repos/$REPO/issues/$ISSUE/comments" \
            -f body="@$MAINTAINER The weekly upkeep has new items to review. The issue body lists them."
          gh api -X DELETE "repos/$REPO/issues/$ISSUE/labels/upkeep:%20needs%20review"
