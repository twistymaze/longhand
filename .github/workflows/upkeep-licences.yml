# Makes the full licence lists for a dependency branch of the weekly upkeep
# routine (docs/upkeep/README.md). The routine changes only lockfiles and
# never runs dependency code in its own session. This job runs the frontend
# build and cargo-about for the routine, and uploads licences/generated/ as an
# artifact that the routine downloads and commits (plan KTD4, R9).
#
# The job reads the repository only and has no secrets. It accepts only a
# branch whose name starts with "upkeep/". When the generator fails, for
# example on a tailwindcss version that licences/manifest.json does not list
# or on a changed licence file that about.toml checks, the log names the
# package, and the routine holds that update.

name: Upkeep licences

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Upkeep branch to make the licence lists for (upkeep/...)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: upkeep-licences-${{ inputs.branch }}
  cancel-in-progress: true

jobs:
  licences:
    name: Licence lists
    if: startsWith(inputs.branch, 'upkeep/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.branch }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install cargo-about
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2
        with:
          tool: cargo-about@0.9.2

      - name: Make the licence lists
        run: |
          bun install --frozen-lockfile
          cargo fetch --locked
          bun run build
          bun scripts/licences/generate.ts

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: licences-generated
          path: licences/generated/
          if-no-files-found: error
          retention-days: 7

  refuse:
    name: Refuse a branch that is not an upkeep branch
    if: ${{ !startsWith(inputs.branch, 'upkeep/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Refuse
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          echo "Only a branch that starts with upkeep/ is accepted, not: $BRANCH"
          exit 1
