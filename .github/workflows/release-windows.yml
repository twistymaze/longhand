# Builds the unsigned Windows installer for a release and attaches it to
# that release (docs/releases.md). It runs after CI completes successfully
# for a push to main, and it is a separate workflow so that the long
# Windows build does not hold back the next CI run on main (KTD2). It has
# its own concurrency group: when a newer run waits, GitHub replaces an
# older waiting run, and that release gets no installer.
#
# To build the installer of a release again, for example after a fix to
# this workflow: `gh workflow run release-windows.yml -f tag=v<version>`.
#
# The build job can only read the repository. The attach job is the only
# job that can write, and it runs no build code (R25). Every action is
# pinned by its full commit SHA.

name: Release Windows installer

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag, for example v1.0.4
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-windows
  cancel-in-progress: false

jobs:
  # Finds the release and the commit to build. For a CI run, that is the
  # release whose target is the commit that CI tested. In a workflow_run
  # run, github.sha is the newest commit on main, not that commit. With no
  # release, the other jobs do not run.
  find:
    name: Find the release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.find.outputs.tag }}
      commit: ${{ steps.find.outputs.commit }}
    steps:
      # An explicit bash sets pipefail, so a failed API call fails the step
      # and does not become "no release".
      - name: Find the release
        id: find
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -n "$TAG" ]; then
            commit=$(gh api "repos/$REPOSITORY/releases/tags/$TAG" --jq .target_commitish)
          else
            TAG=$(gh api "repos/$REPOSITORY/releases" --paginate \
              --jq ".[] | select(.draft == false and .target_commitish == \"$HEAD_SHA\") | .tag_name" | head -n 1)
            commit=$HEAD_SHA
          fi
          if [ -z "$TAG" ]; then
            echo "No release targets this commit. Nothing to build."
          else
            echo "Release $TAG, commit $commit"
          fi
          {
            echo "tag=$TAG"
            echo "commit=$commit"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build the installer
    needs: find
    if: needs.find.outputs.tag != ''
    # A standard runner: free for a public repository, and clean, so a
    # published file does not depend on the state of a self-hosted runner.
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: 0
    defaults:
      run:
        shell: bash
    steps:
      # transcribe-cpp builds ggml from source; its deep paths need long-path
      # support on Windows (as Handy's CI enables it).
      - name: Enable long paths
        shell: pwsh
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
          git config --system core.longpaths true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.find.outputs.commit }}

      # The same setup as the Windows checks in ci.yml. A release build has
      # its own artifacts, so it has its own cache key.
      - name: Windows build setup
        uses: ./.github/actions/windows-build-setup
        with:
          prefix-key: v1-release-windows

      # rust-cache removes non-Cargo files from target during cache save,
      # so the NeMo cache goes in the temp folder. The version goes into the
      # build through a config file, not a commit (KTD6).
      - name: Record the NeMo cache path and the release config
        env:
          TAG: ${{ needs.find.outputs.tag }}
        run: |
          echo "LONGHAND_NEMO_CACHE=$RUNNER_TEMP/longhand-nemo" >> "$GITHUB_ENV"
          jq -n --arg version "${TAG#v}" '{version: $version}' > "$RUNNER_TEMP/release.json"

      # No LONGHAND_RELEASE: Windows builds get no updates yet (R19). The
      # commit shows in About.
      - name: Tauri build (Windows installer, release)
        shell: pwsh
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
        env:
          LONGHAND_BUILD_COMMIT: ${{ needs.find.outputs.commit }}
        run: |
          bun tauri build --bundles nsis --config "$env:RUNNER_TEMP/release.json"
          if ($LASTEXITCODE -ne 0) { throw "Tauri build failed" }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-windows
          path: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

  # Attaches the installer to the release. It is the only job in this
  # workflow that can write to the repository, and it runs no build code:
  # no `bun install` and no cargo, only the publish script (R25).
  attach:
    name: Attach the installer
    needs: [find, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-windows
          path: ${{ runner.temp }}/installer

      - name: Attach
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ needs.find.outputs.tag }}
        run: bun scripts/publish-release.ts attach "$TAG" "$(ls "$RUNNER_TEMP"/installer/*.exe)"
