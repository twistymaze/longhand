name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      # transcribe-cpp builds ggml from source; its deep paths need long-path
      # support on Windows (as Handy's CI enables it).
      - name: Enable long paths (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
          git config --system core.longpaths true

      - uses: actions/checkout@v4

      # The Windows x64 build links ggml's Vulkan backend (KTD6), which needs
      # the SDK's headers and glslc at build time. Version as Handy pins it.
      - name: Install Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Frontend build (typecheck + bundle)
        run: bun run build

      - name: Frontend tests
        run: bun run test

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: tests
        if: runner.os != 'Windows'
        run: cargo test --workspace

      # A test binary that links Tauri lacks the Windows app manifest (Tauri
      # embeds it into the application binary only), so it cannot start there:
      # STATUS_ENTRYPOINT_NOT_FOUND. The app crate's tests are
      # platform-independent and run on macOS; Windows compiles them.
      - name: tests (Windows)
        if: runner.os == 'Windows'
        run: |
          cargo test --workspace --exclude longhand
          cargo test -p longhand --no-run

      - name: Bindings are current
        if: runner.os == 'macOS'
        run: |
          cargo test -p longhand export_bindings
          git diff --exit-code src/bindings.ts

      - name: Provenance (R26, R27)
        run: |
          scripts/check-provenance.sh --self-test
          scripts/check-provenance.sh

      - name: Tauri build (macOS, ad-hoc signed)
        if: runner.os == 'macOS'
        # CI holds no signing certificate; "-" overrides the Developer ID
        # identity in tauri.conf.json with an ad-hoc signature.
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: bun tauri build --bundles app

      - name: Tauri build (Windows installer)
        if: runner.os == 'Windows'
        run: bun tauri build --bundles nsis

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses sources bans
