name: CI

# The macOS and Windows jobs run on home runners when the repository
# variables MACOS_RUNNER and WINDOWS_RUNNER name them, and
# on GitHub's runners otherwise. Minutes on GitHub's
# runners are billed while the repository is private. Local checks gate
# day-to-day work (scripts/check-windows.sh included); CI runs when a branch
# asks to merge, when a change that is not only docs is pushed to main, and
# on demand: `gh workflow run ci.yml --ref <branch>`.
on:
  pull_request:
    branches: [main]
  # A run on main saves a cache that every pull request can restore. A pull
  # request cannot restore the cache of another pull request, so without a
  # cache from main, the first run of each pull request compiles everything.
  # Docs cannot change what the checks test, so a push of only docs runs
  # nothing. Docs are every Markdown file (plans, ideas, solutions, agent
  # guidance, READMEs), the agent config folders and the root LICENSE.
  # PROVENANCE.md is the exception: the provenance check reads it. A later
  # pattern overrides an earlier one.
  push:
    branches: [main]
    paths:
      - "**"
      - "!**.md"
      - "!docs/**"
      - "!.claude/**"
      - "!.compound-engineering/**"
      - "!LICENSE"
      - "**/PROVENANCE.md"
  workflow_dispatch:
    inputs:
      soak:
        description: Also run the four-hour recorder soak (U21)
        type: boolean
        default: false
      windows_installer:
        description: Also build a release Windows installer and upload it for a manual test
        type: boolean
        default: false
      hosted:
        description: Run the checks on GitHub's runners, not the home runners
        type: boolean
        default: false

permissions:
  contents: read

# A new push to a pull request stops its old run. Runs on main all
# complete, so that each one saves its cache.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        # `os` names the job, and the job names are required checks in the
        # main ruleset, so `os` never changes. `runner` chooses where the job
        # runs: the home runner that a repository variable names, or GitHub's
        # runner when the variable is not set or the `hosted` input is true.
        # On GitHub, Windows runs on the org's larger runner (8 cores, 32 GB,
        # Windows Server 2025, the windows-latest image).
        include:
          - os: macos-latest
            runner: ${{ !inputs.hosted && vars.MACOS_RUNNER || 'macos-latest' }}
          - os: windows-latest
            runner: ${{ !inputs.hosted && vars.WINDOWS_RUNNER || 'windows-8core' }}
    runs-on: ${{ matrix.runner }}
    # A home runner runs one job at a time, so a hung job must not hold it
    # for GitHub's default of 6 hours. A cold run with the release installer
    # takes about 30 minutes.
    timeout-minutes: 60
    # A home runner keeps target/ between jobs. Incremental compilation is
    # off on every runner, as rust-cache sets it on GitHub's runners, so
    # target/ stays smaller and both runners build the same way.
    env:
      CARGO_INCREMENTAL: 0
    defaults:
      run:
        shell: bash
    steps:
      # transcribe-cpp builds ggml from source; its deep paths need long-path
      # support on Windows (as Handy's CI enables it). The home runner's
      # image has this setting already.
      - name: Enable long paths (Windows)
        if: runner.os == 'Windows' && runner.environment == 'github-hosted'
        shell: pwsh
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
          git config --system core.longpaths true

      # On a home runner the checkout keeps the ignored build output
      # (target/, node_modules/, src-tauri/nemo-runtime/) from the last job,
      # so the build starts warm. Tracked files still match the commit.
      - uses: actions/checkout@v7
        with:
          clean: ${{ runner.environment == 'github-hosted' }}

      # A Dev Drive (ReFS on a VHDX) makes the build's many small reads and
      # writes faster than NTFS on the runner's disk. A trusted Dev Drive also
      # stops Defender from scanning each file. The workspace, the target dir,
      # CARGO_HOME and RUSTUP_HOME all move onto it, so the steps that build
      # run in DEV_DRIVE_WORKSPACE. The drive is dynamic: the size is a limit,
      # and the VHDX takes only the space that the build writes. This step
      # must come before rust-cache: post steps run in reverse order, so
      # rust-cache saves the cache before this action dismounts the drive.
      # The home runner has a permanent Dev Drive that holds its work folder.
      - name: Set up a Dev Drive (Windows)
        if: runner.os == 'Windows' && runner.environment == 'github-hosted'
        uses: samypr100/setup-dev-drive@v4
        with:
          drive-size: 40GB
          workspace-copy: true
          trusted-dev-drive: true
          env-mapping: |
            CARGO_HOME,{{ DEV_DRIVE }}/.cargo
            RUSTUP_HOME,{{ DEV_DRIVE }}/.rustup

      # The Windows x64 build links ggml's Vulkan backend (KTD6), which needs
      # the SDK's headers and glslc at build time. Version as Handy pins it.
      # The action's own cache holds only the installer, which downloads in
      # seconds, and it runs on the deprecated Node 20 `actions/cache@v4`.
      # The home runner's image has the same SDK version and sets VULKAN_SDK.
      - name: Install Vulkan SDK (Windows)
        if: runner.os == 'Windows' && runner.environment == 'github-hosted'
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: false

      # ggml-vulkan does `find_package(SPIRV-Headers CONFIG REQUIRED)`, and the
      # SDK install exposes no findable SPIRV-HeadersConfig.cmake. The
      # header-only vcpkg package on CMAKE_PREFIX_PATH resolves it, as Handy's
      # CI does.
      - name: Install SPIRV-Headers (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install spirv-headers:x64-windows
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install spirv-headers failed" }
          $prefix = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows" -replace '\\','/'
          $combined = if ($env:CMAKE_PREFIX_PATH) { "$prefix;$env:CMAKE_PREFIX_PATH" } else { $prefix }
          Add-Content $env:GITHUB_ENV "CMAKE_PREFIX_PATH=$combined"

      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt, clippy
          # For the Windows lint that runs on macOS (below).
          targets: ${{ runner.os == 'macOS' && 'x86_64-pc-windows-msvc' || '' }}

      # Saved even when a later step fails: otherwise a job that has never
      # passed never gets a cache, and every run compiles ggml, ONNX Runtime
      # and SQLite from scratch. The key follows Cargo.lock only, and an exact
      # hit is never saved again, so a change to how CI builds (flags,
      # profiles, which cargo commands run) needs `prefix-key` bumped or its
      # new artifacts are never cached. A home runner skips this: its target/
      # stays from the last job, and a cache save would prune it.
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          prefix-key: v3-rust
          cache-on-failure: true
          workspaces: ${{ env.DEV_DRIVE_WORKSPACE || '.' }}

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
        run: bun install --frozen-lockfile

      # Frontmatter and links of the feature ideas (docs/ideas/README.md).
      - name: Feature ideas
        if: runner.os == 'macOS'
        run: bun scripts/ideas.ts check

      # msvc-dev-cmd documents that Git Bash can select GNU link.exe before MSVC.
      # Use the native Windows shell for Rust, as upstream transcribe.cpp does:
      # https://github.com/ilammy/msvc-dev-cmd#name-conflicts-with-shell-bash
      - name: Rust helper tests before SDK build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = Join-Path $env:VCToolsInstallDir 'bin\Hostx64\x64\link.exe'
          if (-not (Test-Path $expected)) { throw "MSVC linker is absent: $expected" }
          $expected = (Get-Item -LiteralPath $expected).FullName
          $actual = (Get-Command link.exe -CommandType Application -ErrorAction Stop | Select-Object -First 1).Source
          if (-not [string]::Equals($actual, $expected, [System.StringComparison]::OrdinalIgnoreCase)) {
            throw "Wrong linker selected: $actual; expected $expected"
          }
          Write-Output "Rust linker: $actual"
          cargo test -p nemo-runtime --features test-helper
          if ($LASTEXITCODE -ne 0) { throw 'Rust helper tests failed' }

      - name: Rust helper tests before SDK build (macOS)
        if: runner.os == 'macOS'
        run: cargo test -p nemo-runtime --features test-helper

      - name: Build and stage NeMo helper
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
        env:
          APPLE_SIGNING_IDENTITY: "-"
          # rust-cache removes non-Cargo files from target during cache save,
          # so on GitHub's runners the NeMo cache goes in the temp folder. A
          # home runner sets LONGHAND_NEMO_CACHE in its environment file to a
          # folder that stays between jobs.
          NEMO_CACHE_IN_TEMP: ${{ runner.temp }}/longhand-nemo
        run: |
          export LONGHAND_NEMO_CACHE="${LONGHAND_NEMO_CACHE:-$NEMO_CACHE_IN_TEMP}"
          echo "LONGHAND_NEMO_CACHE=$LONGHAND_NEMO_CACHE" >> "$GITHUB_ENV"
          bun test scripts/windows-redist.test.ts
          bun scripts/prepare-nemo.ts

      - name: Native helper protocol smoke test
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
        run: bun scripts/test-nemo.ts --helper "src-tauri/nemo-runtime/bin/longhand-nemo-helper${{ runner.os == 'Windows' && '.exe' || '' }}"

      # The two jobs run side by side, so the run lasts as long as the slower
      # Windows job. Checks that come out the same on every platform
      # (frontend, formatting, lint, bindings, provenance) run on macOS only;
      # Windows runs what differs there: the tests and the installer.
      - name: Frontend build (typecheck + bundle)
        if: runner.os == 'macOS'
        run: bun run build

      # The stored full licence list matches what each platform ships (R12).
      # cargo-about reads `cargo metadata` and compiles nothing, so the Rust
      # cache key stays the same. `cargo fetch` unpacks the crates whose
      # licence files cargo-about reads offline.
      - name: Install cargo-about
        if: runner.os == 'macOS'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2

      - name: Licences (R12)
        if: runner.os == 'macOS'
        run: |
          cargo fetch --locked
          scripts/check-licences.sh --self-test
          scripts/check-licences.sh

      - name: Frontend tests
        if: runner.os == 'macOS'
        run: bun run test

      - name: Publish script tests
        if: runner.os == 'macOS'
        run: bun test scripts/publish-preview.test.ts

      - name: rustfmt
        if: runner.os == 'macOS'
        run: cargo fmt --all --check

      - name: clippy
        if: runner.os == 'macOS'
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Lints the Windows-only code from macOS, in place of clippy on the
      # Windows runner. It leaves out the crates that build C or C++, whose
      # Windows code the Windows tests still compile.
      - name: clippy for Windows
        if: runner.os == 'macOS'
        run: scripts/check-windows.sh

      # One cargo command over the same crates as clippy, so shared
      # dependencies compile once and ggml's C++ build runs once. The app's
      # test binaries start on Windows because build.rs embeds the app
      # manifest in every binary the app crate links.
      - name: Workspace Rust tests (macOS)
        if: runner.os == 'macOS'
        run: cargo test --workspace --features nemo-runtime/test-helper

      - name: Workspace Rust tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
        run: cargo test --workspace --features nemo-runtime/test-helper

      # The tests just regenerated src/bindings.ts (`export_bindings`).
      - name: Bindings are current
        if: runner.os == 'macOS'
        run: git diff --exit-code src/bindings.ts

      - name: Provenance (R26, R27)
        if: runner.os == 'macOS'
        run: |
          scripts/check-provenance.sh --self-test
          scripts/check-provenance.sh

      # These builds prove the app bundles, not how fast it runs, so they
      # use the debug profile the tests just built: a release build compiles
      # every dependency a second time (412 crates) and doubles the cache.
      # Each build first deletes its bundle folder: on a home runner the
      # folder keeps the bundles of earlier versions, and a later step must
      # find only this build's bundle.
      - name: Tauri build (macOS, ad-hoc signed)
        if: runner.os == 'macOS'
        # CI holds no signing certificate; "-" overrides the Developer ID
        # identity in tauri.conf.json with an ad-hoc signature.
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: |
          rm -rf target/debug/bundle
          bun tauri build --debug --bundles app

      - name: Installed NeMo helper CPU inference (macOS)
        if: runner.os == 'macOS'
        run: |
          helper="target/debug/bundle/macos/Longhand.app/Contents/Frameworks/LonghandNeMo/longhand-nemo-helper"
          codesign --verify --strict "$helper"
          bun scripts/validate-recognition/installed-smoke.ts "$helper"

      # The installer carries the VC++ runtime app-local, so Longhand starts
      # on a machine without a current redistributable. build.rs stages the
      # DLLs from these dirs, taken from the Visual Studio install that
      # compiled the native code, as Handy's CI does.
      - name: Locate the VC++ runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsRoot = & $vswhere -latest -products * -property installationPath
          if (-not $vsRoot) { throw "vswhere found no Visual Studio installation" }
          $version = (Get-Content (Join-Path $vsRoot "VC\Auxiliary\Build\Microsoft.VCRedistVersion.default.txt")).Trim()
          $archDir = Join-Path $vsRoot "VC\Redist\MSVC\$version\x64"
          $crt = Get-ChildItem $archDir -Directory -Filter "Microsoft.VC*.CRT" | Sort-Object Name | Select-Object -Last 1
          if (-not $crt -or -not (Test-Path (Join-Path $crt.FullName "msvcp140.dll"))) {
            throw "VC++ CRT redist not found under $archDir"
          }
          $dirs = $crt.FullName
          $omp = Get-ChildItem $archDir -Directory -Filter "Microsoft.VC*.OpenMP" | Sort-Object Name | Select-Object -Last 1
          if ($omp) { $dirs = "$dirs;$($omp.FullName)" }
          Add-Content -Path $env:GITHUB_ENV -Value "LONGHAND_VC_REDIST_DIRS=$dirs"

      - name: Tauri build (Windows installer)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
        run: |
          Remove-Item -Recurse -Force target/debug/bundle -ErrorAction SilentlyContinue
          bun tauri build --debug --bundles nsis
          if ($LASTEXITCODE -ne 0) { throw "Tauri build failed" }

      # A runner has the runtime installed, so launching the app here would
      # not notice it missing; the installer's contents do.
      - name: Installer carries the VC++ runtime (Windows)
        if: runner.os == 'Windows'
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
        run: |
          installer=$(ls target/debug/bundle/nsis/*.exe | head -1)
          listing=$(7z l "$installer")
          for dll in msvcp140.dll vcruntime140.dll; do
            grep -qi "$dll" <<<"$listing" || { echo "$installer lacks $dll"; exit 1; }
          done

      - name: Installed NeMo helper CPU inference (Windows)
        if: runner.os == 'Windows'
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
        shell: pwsh
        run: |
          $installer = Get-ChildItem target/debug/bundle/nsis/*.exe | Select-Object -First 1
          Remove-Item -Recurse -Force target/recognition-installer -ErrorAction SilentlyContinue
          # A home runner keeps target/. An old helper left here would pass
          # the test for an installer that lacks the helper.
          if (Test-Path target/recognition-installer) { throw "target/recognition-installer is still present" }
          & 7z x $installer.FullName "-otarget/recognition-installer" -y
          if ($LASTEXITCODE -ne 0) { throw "Installer extraction failed" }
          $helper = Get-ChildItem target/recognition-installer -Recurse -Filter longhand-nemo-helper.exe | Select-Object -First 1
          if (-not $helper) { throw "Installer lacks the NeMo helper" }
          bun scripts/validate-recognition/installed-smoke.ts $helper.FullName
          if ($LASTEXITCODE -ne 0) { throw "Installed helper inference failed" }

      # A manual test needs the release profile: the debug build above is
      # too slow to show real performance. On demand only, because the
      # release build compiles every dependency again:
      # `gh workflow run ci.yml --ref <branch> -f windows_installer=true`.
      - name: Tauri build (Windows installer, release)
        if: runner.os == 'Windows' && github.event_name == 'workflow_dispatch' && inputs.windows_installer
        shell: pwsh
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
        run: |
          Remove-Item -Recurse -Force target/release/bundle -ErrorAction SilentlyContinue
          bun tauri build --bundles nsis
          if ($LASTEXITCODE -ne 0) { throw "Tauri build failed" }

      - name: Upload the Windows installer
        if: runner.os == 'Windows' && github.event_name == 'workflow_dispatch' && inputs.windows_installer
        uses: actions/upload-artifact@v7
        with:
          name: longhand-windows-installer
          path: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

      # Shows how much of the Dev Drive and the runner's disks the job used,
      # to check the drive size.
      - name: Disk use (Windows)
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: Get-PSDrive -PSProvider FileSystem

  # The recorder soak writes 1.4 GB as fast as the disk takes it. On demand
  # rather than nightly, since runner minutes are billed:
  # `gh workflow run ci.yml --ref <branch> -f soak=true`.
  soak:
    name: Recorder soak
    if: github.event_name == 'workflow_dispatch' && inputs.soak
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-soak
      - name: Recorder soak
        run: cargo test -p recorder --release --test soak -- --ignored --nocapture

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses sources bans

  # Each push to main that passes the checks publishes a signed, notarized
  # preview build to the public builds repository (docs/preview-builds.md).
  # Only this job can read the signing and publish secrets: the `preview`
  # environment accepts only main, and each secret goes only to the step
  # that uses it. Each action is pinned by its commit SHA, because a moved
  # tag must not get these secrets.
  preview:
    name: Preview build
    # A build publishes only when every check passes, the licence gate too (R1).
    needs: [checks, deny]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    environment: preview
    permissions:
      contents: read
    # One preview job at a time. A queued job for a newer push replaces a
    # queued older one. The version check (KTD2) makes any order safe.
    concurrency:
      group: preview
      cancel-in-progress: false
    timeout-minutes: 120
    env:
      BUILDS_REPOSITORY: twistymaze/longhand-builds
    steps:
      # The start time bounds the commit time (KTD5). The job-level env
      # cannot use the runner context, so this step sets the temporary
      # paths. rust-cache removes non-Cargo files from target during cache
      # save, so the NeMo cache is outside target.
      - name: Record the job start and the temporary paths
        run: |
          {
            echo "JOB_START=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "KEYCHAIN=$RUNNER_TEMP/preview.keychain-db"
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8"
            echo "LONGHAND_NEMO_CACHE=$RUNNER_TEMP/longhand-nemo"
          } >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@fef00d40025f7fd8f1ec759cbbb0f577ddfc3133 # 1.94.0

      # A release build has its own artifacts, so it has its own cache key.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: v1-preview
          cache-on-failure: true

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # `<config version>-preview.<UTC committer time>` (R6). The config file
      # also turns on the updater archive, so local builds need no updater key.
      - name: Preview version
        id: version
        run: |
          version=$(bun scripts/publish-preview.ts version \
            "$(jq -r .version src-tauri/tauri.conf.json)" "$(git log -1 --format=%cI)" "$JOB_START")
          jq -n --arg version "$version" '{version: $version, bundle: {createUpdaterArtifacts: true}}' \
            > "$RUNNER_TEMP/preview.json"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Preview version: $version"

      # beforeBuildCommand signs the NeMo helper before Tauri's own
      # certificate import would run, so the certificate goes into a
      # temporary keychain first (KTD4). Steps as in Handy's build.yml.
      - name: Import the Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          password=$(openssl rand -base64 24)
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$KEYCHAIN"
          security set-keychain-settings -t 7200 -u "$KEYCHAIN"
          security unlock-keychain -p "$password" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Developer ID Application" \
            || { echo "The certificate is not a Developer ID Application identity"; exit 1; }

      - name: Write the notarization key
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          umask 077
          printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$APPLE_API_KEY_PATH"

      # Tauri signs, notarizes and staples the app, then makes the updater
      # archive and its signature from the stapled app.
      - name: Tauri build (release, notarized)
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          LONGHAND_BUILD_COMMIT: ${{ github.sha }}
          LONGHAND_TRACK: preview
        run: bun tauri build --bundles app,dmg --config "$RUNNER_TEMP/preview.json"

      - name: Notarize and staple the DMG
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          dmg=$(ls target/release/bundle/dmg/*.dmg)
          xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" --wait --timeout 30m
          xcrun stapler staple "$dmg"
          echo "DMG=$dmg" >> "$GITHUB_ENV"

      - name: Check the signatures and the notarization
        run: |
          app=target/release/bundle/macos/Longhand.app
          codesign --verify --deep --strict "$app"
          xcrun stapler validate "$app"
          xcrun stapler validate "$DMG"
          spctl -a -vv "$app"
          spctl -a -vv -t open --context context:primary-signature "$DMG"
          test -s target/release/bundle/macos/Longhand.app.tar.gz.sig

      - name: Publish
        env:
          BUILDS_TOKEN: ${{ secrets.BUILDS_TOKEN }}
        run: |
          bun scripts/publish-preview.ts publish "${{ steps.version.outputs.version }}" "$DMG" \
            target/release/bundle/macos/Longhand.app.tar.gz target/release/bundle/macos/Longhand.app.tar.gz.sig

      - name: Delete the keychain and the notarization key
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN" 2>/dev/null || true
          rm -f "$APPLE_API_KEY_PATH"
