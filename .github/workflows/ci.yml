name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows takes far longer than macOS, so a push checks macOS only.
        # Pull requests into main and manual runs check both; run Windows on
        # a branch with `gh workflow run ci.yml --ref <branch>`.
        os: ${{ fromJSON(github.event_name == 'push' && '["macos-latest"]' || '["macos-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      # transcribe-cpp builds ggml from source; its deep paths need long-path
      # support on Windows (as Handy's CI enables it).
      - name: Enable long paths (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
          git config --system core.longpaths true

      - uses: actions/checkout@v7

      # The Windows x64 build links ggml's Vulkan backend (KTD6), which needs
      # the SDK's headers and glslc at build time. Version as Handy pins it.
      # The action's own cache holds only the installer, which downloads in
      # seconds, and it runs on the deprecated Node 20 `actions/cache@v4`.
      - name: Install Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: false

      # ggml-vulkan does `find_package(SPIRV-Headers CONFIG REQUIRED)`, and the
      # SDK install exposes no findable SPIRV-HeadersConfig.cmake. The
      # header-only vcpkg package on CMAKE_PREFIX_PATH resolves it, as Handy's
      # CI does.
      - name: Install SPIRV-Headers (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install spirv-headers:x64-windows
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install spirv-headers failed" }
          $prefix = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows" -replace '\\','/'
          $combined = if ($env:CMAKE_PREFIX_PATH) { "$prefix;$env:CMAKE_PREFIX_PATH" } else { $prefix }
          Add-Content $env:GITHUB_ENV "CMAKE_PREFIX_PATH=$combined"

      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt, clippy

      # Saved even when a later step fails: otherwise a job that has never
      # passed never gets a cache, and every run compiles ggml, ONNX Runtime
      # and SQLite from scratch.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Frontend build (typecheck + bundle)
        run: bun run build

      - name: Frontend tests
        run: bun run test

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: tests
        if: runner.os != 'Windows'
        run: cargo test --workspace

      # A test binary that links Tauri lacks the Windows app manifest (Tauri
      # embeds it into the application binary only), so it cannot start there:
      # STATUS_ENTRYPOINT_NOT_FOUND. The app crate's tests are
      # platform-independent and run on macOS; Windows compiles them.
      - name: tests (Windows)
        if: runner.os == 'Windows'
        run: |
          cargo test --workspace --exclude longhand
          cargo test -p longhand --no-run

      - name: Bindings are current
        if: runner.os == 'macOS'
        run: |
          cargo test -p longhand export_bindings
          git diff --exit-code src/bindings.ts

      - name: Provenance (R26, R27)
        run: |
          scripts/check-provenance.sh --self-test
          scripts/check-provenance.sh

      # These builds prove the app bundles, not how fast it runs, so they
      # skip the release profile's whole-program optimization, which redoes
      # its final pass on every build (about four minutes).
      - name: Tauri build (macOS, ad-hoc signed)
        if: runner.os == 'macOS'
        # CI holds no signing certificate; "-" overrides the Developer ID
        # identity in tauri.conf.json with an ad-hoc signature.
        env:
          APPLE_SIGNING_IDENTITY: "-"
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: bun tauri build --bundles app

      - name: Tauri build (Windows installer)
        if: runner.os == 'Windows'
        env:
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: bun tauri build --bundles nsis

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses sources bans
