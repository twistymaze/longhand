name: CI

# The repository variables MACOS_RUNNER and WINDOWS_RUNNER choose the runner
# of the macOS and Windows checks, and MACOS_RELEASE_RUNNER chooses the
# runner of the release build: a self-hosted runner or a GitHub label (for
# example a larger runner). With no variable, a job runs on GitHub's standard
# runner. A self-hosted macOS runner is ephemeral: each job gets a new VM,
# and the runner's environment file sets LONGHAND_RUNNER_EPHEMERAL. The
# Windows check of a pull request always runs on GitHub's standard runner,
# which is free for a public repository; WINDOWS_RUNNER (a larger runner)
# applies to main and to runs on demand. Local checks gate
# day-to-day work (scripts/check-windows.sh included); CI runs when a branch
# asks to merge, when a change that is not only docs is pushed to main, and
# on demand: `gh workflow run ci.yml --ref <branch>`.
on:
  pull_request:
    branches: [main]
  # A run on main saves a cache that every pull request can restore. A pull
  # request cannot restore the cache of another pull request, so without a
  # cache from main, the first run of each pull request compiles everything.
  # Docs cannot change what the checks test, so a push of only docs runs
  # nothing. Docs are every Markdown file (plans, ideas, solutions, agent
  # guidance, READMEs), the agent config folders and the root LICENSE.
  # PROVENANCE.md is the exception: the provenance check reads it. A later
  # pattern overrides an earlier one.
  push:
    branches: [main]
    paths:
      - "**"
      - "!**.md"
      - "!docs/**"
      - "!.claude/**"
      - "!.compound-engineering/**"
      - "!LICENSE"
      - "**/PROVENANCE.md"
  workflow_dispatch:
    inputs:
      soak:
        description: Also run the four-hour recorder soak (U21)
        type: boolean
        default: false
      hosted:
        description: Run the checks on GitHub's standard runners, not the runners that the repository variables name
        type: boolean
        default: false

permissions:
  contents: read

# A new push to a pull request stops its old run. Runs on main all
# complete, so that each one saves its cache.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        # `os` names the job, and the job names are required checks in the
        # main ruleset, so `os` never changes. `runner` chooses where the job
        # runs: the runner that a repository variable names, or GitHub's
        # standard runner when the variable is not set or the `hosted` input
        # is true. The standard runners are free for a public repository. The
        # standard Windows runner is the runner of the Windows release build.
        include:
          - os: macos-latest
            runner: ${{ !inputs.hosted && vars.MACOS_RUNNER || 'macos-latest' }}
          - os: windows-latest
            runner: ${{ (inputs.hosted || github.event_name == 'pull_request') && 'windows-latest' || vars.WINDOWS_RUNNER || 'windows-latest' }}
    runs-on: ${{ matrix.runner }}
    # The feature ideas check reads the merged pull requests. A job block
    # replaces the workflow block, so it names `contents` again.
    permissions:
      contents: read
      pull-requests: read
    # A self-hosted runner runs one job at a time, so a hung job must not hold it
    # for GitHub's default of 6 hours.
    timeout-minutes: 60
    # The persistent runner keeps target/ between jobs. Incremental compilation is
    # off on every runner, as rust-cache sets it when it runs, so target/
    # stays smaller and all runners build the same way.
    env:
      CARGO_INCREMENTAL: 0
    defaults:
      run:
        shell: bash
    steps:
      # transcribe-cpp builds ggml from source; its deep paths need long-path
      # support on Windows (as Handy's CI enables it). The self-hosted runner's
      # image has this setting already.
      - name: Enable long paths (Windows)
        if: runner.os == 'Windows' && runner.environment == 'github-hosted'
        shell: pwsh
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
          git config --system core.longpaths true

      # On the persistent runner the checkout keeps the ignored build output
      # (target/, node_modules/, src-tauri/nemo-runtime/) from the last job,
      # so the build starts warm. Tracked files still match the commit. An
      # ephemeral runner starts with no checkout, so the setting has no effect.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          clean: ${{ runner.environment == 'github-hosted' }}

      # The Windows build setup is in one composite action, which the release
      # installer build also uses, so both build the same way. It runs after
      # the checkout, because the action is a file in the repository. It
      # sets DEV_DRIVE_WORKSPACE on GitHub's runners, and
      # LONGHAND_VC_REDIST_DIRS for the installer (build.rs).
      - name: Windows build setup
        if: runner.os == 'Windows'
        uses: ./.github/actions/windows-build-setup
        with:
          prefix-key: v4-rust

      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
        if: runner.os == 'macOS'
        with:
          components: rustfmt, clippy
          # For the Windows lint that runs on macOS (below).
          targets: x86_64-pc-windows-msvc

      # Saved even when a later step fails: otherwise a job that has never
      # passed never gets a cache, and every run compiles ggml, ONNX Runtime
      # and SQLite from scratch. The key follows Cargo.lock only, and an exact
      # hit is never saved again, so a change to how CI builds (flags,
      # profiles, which cargo commands run) needs `prefix-key` bumped or its
      # new artifacts are never cached. GitHub's runners and an ephemeral
      # runner use this cache (LONGHAND_GHA_CACHE). The persistent runner
      # skips it: its target/ stays from the last job, and a cache save would
      # prune it. On Windows, the Windows build setup has the same step with
      # the same prefix key.
      - name: Select the GitHub Actions cache
        if: runner.os == 'macOS'
        env:
          HOSTED: ${{ runner.environment == 'github-hosted' }}
        run: |
          if [ "$HOSTED" = true ] || [ -n "${LONGHAND_RUNNER_EPHEMERAL:-}" ]; then
            echo "LONGHAND_GHA_CACHE=true" >> "$GITHUB_ENV"
          fi

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: runner.os == 'macOS' && env.LONGHAND_GHA_CACHE == 'true'
        with:
          prefix-key: v4-rust
          cache-on-failure: true

      # After the Windows build setup and rust-cache, before the first
      # compile. sccache also finds the compiled crates and C/C++ objects
      # that rust-cache and target/ do not have, for example after a
      # Cargo.lock change.
      - uses: ./.github/actions/sccache-setup

      # The Node and npm versions come from devEngines in package.json. On
      # Windows, windows-build-setup did these two steps.
      - uses: ./.github/actions/node-setup
        if: runner.os == 'macOS'

      - name: Install frontend dependencies
        if: runner.os == 'macOS'
        run: npm ci

      # Frontmatter and links of the feature ideas (docs/ideas/README.md).
      # The token lets `gh` list the merged pull requests; an idea whose plan
      # shipped is a warning here, not a failure.
      - name: Feature ideas
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --test scripts/ideas.test.ts
          node scripts/ideas.ts check

      # uv runs the skill scripts and their tests, and a Rust test runs
      # check.py through uv (KTD13 of the safe agent edits plan). It is
      # installed before the first `cargo test`. The scripts use only the
      # standard library, so there is nothing to cache.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.24"
          enable-cache: false

      # The tests of the skill scripts, on the oldest Python that the
      # scripts support and on the current Python. uv downloads each
      # Python.
      - name: Skill script tests
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
        run: |
          scripts=plugins/longhand/skills/longhand-notes/scripts
          for python in 3.9 3.15; do
            uv run --no-project --python "$python" python -m unittest discover -s "$scripts/tests" -t "$scripts"
          done

      # msvc-dev-cmd documents that Git Bash can select GNU link.exe before MSVC.
      # Use the native Windows shell for Rust, as upstream transcribe.cpp does:
      # https://github.com/ilammy/msvc-dev-cmd#name-conflicts-with-shell-bash
      - name: Rust helper tests before SDK build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
        # TEMPORARY: logs why cargo rebuilds each unit. Remove before merge.
        env:
          CARGO_LOG: cargo::core::compiler::fingerprint=info
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = Join-Path $env:VCToolsInstallDir 'bin\Hostx64\x64\link.exe'
          if (-not (Test-Path $expected)) { throw "MSVC linker is absent: $expected" }
          $expected = (Get-Item -LiteralPath $expected).FullName
          $actual = (Get-Command link.exe -CommandType Application -ErrorAction Stop | Select-Object -First 1).Source
          if (-not [string]::Equals($actual, $expected, [System.StringComparison]::OrdinalIgnoreCase)) {
            throw "Wrong linker selected: $actual; expected $expected"
          }
          Write-Output "Rust linker: $actual"
          cargo test -p nemo-runtime --features test-helper
          if ($LASTEXITCODE -ne 0) { throw 'Rust helper tests failed' }

      - name: Rust helper tests before SDK build (macOS)
        if: runner.os == 'macOS'
        run: cargo test -p nemo-runtime --features test-helper

      # On GitHub's Windows runner, the NeMo cache folder (sources, the
      # SentencePiece, SDK and helper builds) comes from the Actions cache.
      # build-nemo.sh checks the pinned revisions and builds only what
      # changed, as it does in a folder that stays between jobs. The key
      # follows the scripts that pin the revisions and patch the source. Only
      # main saves it (step "Save the NeMo cache"), so pull requests do not
      # fill the cache storage. A warm cache saves about 1.5 to 3 minutes.
      # The folder is on the Dev Drive, which has the same path on each
      # runner type. The cache version includes the path, and runner.temp is
      # C:\a\_temp on the larger runner but D:\a\_temp on windows-latest.
      - name: Restore the NeMo cache (Windows)
        id: nemo-cache
        if: runner.os == 'Windows' && runner.environment == 'github-hosted'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DEV_DRIVE }}/longhand-nemo
          key: nemo-${{ runner.os }}-${{ hashFiles('scripts/build-nemo.sh', 'scripts/patch-nemo.ts', 'scripts/prepare-nemo.ts', 'scripts/prepare-vulkan-runtime.ps1') }}

      - name: Build and stage NeMo helper
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
        env:
          APPLE_SIGNING_IDENTITY: "-"
          # rust-cache removes non-Cargo files from target during cache save,
          # so where rust-cache runs, the NeMo cache goes outside target: on
          # the Dev Drive on GitHub's Windows runners (see the restore step),
          # in the temp folder elsewhere. The persistent runner sets
          # LONGHAND_NEMO_CACHE in its environment file to a folder that
          # stays between jobs.
          NEMO_CACHE_IN_TEMP: ${{ env.DEV_DRIVE || runner.temp }}/longhand-nemo
        run: |
          export LONGHAND_NEMO_CACHE="${LONGHAND_NEMO_CACHE:-$NEMO_CACHE_IN_TEMP}"
          echo "LONGHAND_NEMO_CACHE=$LONGHAND_NEMO_CACHE" >> "$GITHUB_ENV"
          node --test scripts/windows-redist.test.ts scripts/patch-nemo.test.ts
          node scripts/prepare-nemo.ts

      - name: Native helper protocol smoke test
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
        run: node scripts/test-nemo.ts --helper "src-tauri/nemo-runtime/bin/longhand-nemo-helper${{ runner.os == 'Windows' && '.exe' || '' }}"

      # The two jobs run side by side, so the run lasts as long as the slower
      # Windows job. Checks that come out the same on every platform
      # (frontend, formatting, lint, bindings, provenance) run on macOS only;
      # Windows runs what differs there: the tests and the installer.
      # The typecheck of the app and of the scripts (tsconfig.scripts.json).
      - name: Typecheck
        if: runner.os == 'macOS'
        run: npm run typecheck

      - name: Frontend build (typecheck + bundle)
        if: runner.os == 'macOS'
        run: npm run build

      # The stored full licence list matches what each platform ships (R12).
      # The lists change only when a licence input changes (the script
      # names them). With no such change, the check only compares the
      # js-packages.json that the frontend build wrote: a new import in the
      # interface changes that file. A manual run checks everything.
      - name: Licence inputs changed
        id: licence-inputs
        if: runner.os == 'macOS'
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || '' }}
        run: scripts/licence-inputs-changed.sh "$BASE" >> "$GITHUB_OUTPUT"

      # cargo-about reads `cargo metadata` and compiles nothing, so the Rust
      # cache key stays the same. `cargo fetch` unpacks the crates whose
      # licence files cargo-about reads offline.
      - name: Install cargo-about
        if: runner.os == 'macOS' && steps.licence-inputs.outputs.changed == 'true'
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2
        with:
          tool: cargo-about@0.9.2

      # The steps before installed the packages and built the frontend.
      - name: Licences (R12)
        if: runner.os == 'macOS'
        env:
          CHANGED: ${{ steps.licence-inputs.outputs.changed }}
        run: |
          scripts/check-licences.sh --self-test
          if [[ "$CHANGED" == true ]]; then
            cargo fetch --locked
            scripts/check-licences.sh --skip-build
          else
            scripts/check-licences.sh --skip-build --no-generate
          fi

      - name: Frontend tests
        if: runner.os == 'macOS'
        run: npm test

      # The release scripts. The version and changelog tests run the real
      # git-cliff on temporary repositories.
      - name: Install git-cliff
        if: runner.os == 'macOS'
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2
        with:
          tool: git-cliff@2.14.2

      - name: Release script tests
        if: runner.os == 'macOS'
        run: node --test scripts/release-version.test.ts scripts/changelog.test.ts scripts/publish-release.test.ts scripts/check-pr-title.test.ts scripts/site.test.ts scripts/site-changed.test.ts scripts/theme.test.ts scripts/platform.test.ts scripts/windows-signing.test.ts

      # The tests of the own version, TOML and frontmatter readers, and of
      # the dependency checks.
      - name: Dependency check script tests
        if: runner.os == 'macOS'
        run: node --test "scripts/lib/**/*.test.ts" scripts/check-dependency-age.test.ts scripts/check-new-advisories.test.ts

      - name: rustfmt
        if: runner.os == 'macOS'
        run: cargo fmt --all --check

      - name: clippy
        if: runner.os == 'macOS'
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Lints the Windows-only code from macOS, in place of clippy on the
      # Windows runner. It leaves out the crates that build C or C++, whose
      # Windows code the Windows tests still compile.
      - name: clippy for Windows
        if: runner.os == 'macOS'
        run: scripts/check-windows.sh

      # One cargo command over the same crates as clippy, so shared
      # dependencies compile once and ggml's C++ build runs once. The app's
      # test binaries start on Windows because build.rs embeds the app
      # manifest in every binary the app crate links.
      - name: Workspace Rust tests (macOS)
        if: runner.os == 'macOS'
        run: cargo test --workspace --features nemo-runtime/test-helper

      # cargo-nextest runs the test binaries side by side; `cargo test` runs
      # them one after the other. nextest does not run doctests, and the
      # macOS job runs them.
      - name: Install cargo-nextest (Windows)
        if: runner.os == 'Windows'
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2
        with:
          tool: cargo-nextest

      - name: Workspace Rust tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
        run: cargo nextest run --workspace --features nemo-runtime/test-helper

      # The tests just regenerated src/bindings.ts (`export_bindings`).
      - name: Bindings are current
        if: runner.os == 'macOS'
        run: git diff --exit-code src/bindings.ts

      - name: Provenance (R26, R27)
        if: runner.os == 'macOS'
        run: |
          scripts/check-provenance.sh --self-test
          scripts/check-provenance.sh

      # These builds prove the app bundles, not how fast it runs, so they
      # use the debug profile the tests just built: a release build compiles
      # every dependency a second time (412 crates) and doubles the cache.
      # Each build first deletes its bundle folder: on the persistent runner the
      # folder keeps the bundles of earlier versions, and a later step must
      # find only this build's bundle.
      - name: Tauri build (macOS, ad-hoc signed)
        if: runner.os == 'macOS'
        # CI holds no signing certificate; "-" overrides the Developer ID
        # identity in tauri.conf.json with an ad-hoc signature.
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: |
          rm -rf target/debug/bundle
          npm run tauri -- build --debug --bundles app

      - name: Installed NeMo helper CPU inference (macOS)
        if: runner.os == 'macOS'
        run: |
          helper="target/debug/bundle/macos/Longhand.app/Contents/Frameworks/LonghandNeMo/longhand-nemo-helper"
          codesign --verify --strict "$helper"
          node scripts/validate-recognition/installed-smoke.ts "$helper"

      - name: Tauri build (Windows installer)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
        # PowerShell removes an unquoted `--` before npm.ps1 gets the
        # arguments, so npm reads the Tauri flags as its own. Quote it.
        run: |
          Remove-Item -Recurse -Force target/debug/bundle -ErrorAction SilentlyContinue
          npm run tauri '--' build --debug --bundles nsis
          if ($LASTEXITCODE -ne 0) { throw "Tauri build failed" }

      # A runner has the runtime installed, so launching the app here would
      # not notice it missing; the installer's contents do.
      - name: Installer carries the VC++ runtime (Windows)
        if: runner.os == 'Windows'
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
        run: |
          installer=$(ls target/debug/bundle/nsis/*.exe | head -1)
          listing=$(7z l "$installer")
          for dll in msvcp140.dll vcruntime140.dll; do
            grep -qi "$dll" <<<"$listing" || { echo "$installer lacks $dll"; exit 1; }
          done

      - name: Installed NeMo helper CPU inference (Windows)
        if: runner.os == 'Windows'
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
        shell: pwsh
        run: |
          $installer = Get-ChildItem target/debug/bundle/nsis/*.exe | Select-Object -First 1
          Remove-Item -Recurse -Force target/recognition-installer -ErrorAction SilentlyContinue
          # The persistent runner keeps target/. An old helper left here would pass
          # the test for an installer that lacks the helper.
          if (Test-Path target/recognition-installer) { throw "target/recognition-installer is still present" }
          & 7z x $installer.FullName "-otarget/recognition-installer" -y
          if ($LASTEXITCODE -ne 0) { throw "Installer extraction failed" }
          $helper = Get-ChildItem target/recognition-installer -Recurse -Filter longhand-nemo-helper.exe | Select-Object -First 1
          if (-not $helper) { throw "Installer lacks the NeMo helper" }
          node scripts/validate-recognition/installed-smoke.ts $helper.FullName
          if ($LASTEXITCODE -ne 0) { throw "Installed helper inference failed" }

      # Shows how much of the Dev Drive and the runner's disks the job used,
      # to check the drive size. The Dev Drive mounts at a folder, so it has
      # no drive letter in the list, and fsutil gives its free space.
      - name: Disk use (Windows)
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-PSDrive -PSProvider FileSystem
          # Information only: an fsutil error must not fail the job.
          if ($env:DEV_DRIVE) { fsutil volume diskfree "$env:DEV_DRIVE\"; $global:LASTEXITCODE = 0 }

      - name: Save the NeMo cache (Windows)
        if: >-
          github.event_name == 'push' && runner.os == 'Windows' &&
          runner.environment == 'github-hosted' &&
          steps.nemo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DEV_DRIVE }}/longhand-nemo
          key: ${{ steps.nemo-cache.outputs.cache-primary-key }}

  # The recorder soak writes 1.4 GB as fast as the disk takes it. On demand
  # rather than nightly, since runner minutes are billed:
  # `gh workflow run ci.yml --ref <branch> -f soak=true`.
  soak:
    name: Recorder soak
    if: github.event_name == 'workflow_dispatch' && inputs.soak
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: v1-soak
      # Each job that runs `cargo test` has uv (KTD13 of the safe agent
      # edits plan).
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.24"
          enable-cache: false
      - name: Recorder soak
        run: cargo test -p recorder --release --test soak -- --ignored --nocapture

  # The ruleset requires this job. On a PR it also checks the dependency
  # versions that the PR adds (docs/development-workflow.md): each one must
  # be at least 7 days old or listed in min-age-exceptions.toml, and the PR
  # must add no advisory that the base does not have. These checks run the
  # scripts of the base checkout on the base's Node version, and read the
  # PR's lockfiles as data. A change to a check script in the PR has no
  # effect on its own run. The PR's workflow and tool configuration (this
  # file, .github/actions, .cargo/config.toml) still apply to the run, so
  # review each change to them. The advisory check gives npm audit the
  # base .npmrc, not the PR's. The PR's .npmrc still applies to each
  # `npm ci` in the other jobs, so also review each change to .npmrc.
  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check licenses sources bans

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
        if: github.event_name == 'pull_request'

      # The base gives the check scripts and the Node and npm versions, so a
      # PR cannot choose the code or the Node that checks it. npm is a tool
      # here, not a project package: the job installs no package. The
      # advisory check runs npm audit.
      - uses: ./.github/actions/node-setup
        if: github.event_name == 'pull_request'
        with:
          package-json: base/package.json

      - name: Install cargo-deny
        if: github.event_name == 'pull_request'
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2
        with:
          tool: cargo-deny@0.20.2

      # The base runs its own copy of each check script. Only a base that
      # does not have the script yet (the PR that adds it) runs the head's.
      # The steps run in the base checkout.
      - name: Check the age of added dependency versions
        id: age
        if: github.event_name == 'pull_request'
        working-directory: base
        run: |
          script=scripts/check-dependency-age.ts
          [[ -f "$script" ]] || script=../scripts/check-dependency-age.ts
          node "$script" . ..

      # This step also runs when the age check fails, so that one run shows
      # both results.
      - name: Check for advisories that the PR adds
        if: ${{ !cancelled() && github.event_name == 'pull_request' && (steps.age.outcome == 'success' || steps.age.outcome == 'failure') }}
        working-directory: base
        run: |
          script=scripts/check-new-advisories.ts
          [[ -f "$script" ]] || script=../scripts/check-new-advisories.ts
          node "$script" . ..

  # Finds whether a push to main is due for a release, its version, its
  # notes and its changelog (docs/releases.md). The workflow-level
  # concurrency group runs the CI runs on main one at a time, so the version
  # that this job computes is still the next one when release-publish
  # publishes it. This job has no secrets. It runs on GitHub's Linux runner,
  # so a push with no release uses no macOS runner. When a release is due,
  # it gives the notes and the changelog to the two release builds and to
  # release-publish in the release-data artifact.
  release-version:
    name: Release version
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    # An explicit bash sets pipefail, so a failed version script fails its
    # step and does not become "no release due".
    defaults:
      run:
        shell: bash
    outputs:
      due: ${{ steps.version.outputs.due }}
      version: ${{ steps.version.outputs.version }}
    steps:
      # git-cliff reads the tags and every commit since the latest release tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2
        with:
          tool: git-cliff@2.14.2

      # The scripts use only Node's built-in modules, so the job runs no npm.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          package-manager-cache: false

      # Whether a release is due, its version and its notes (KTD1). When no
      # release is due, the other steps skip, and the release builds and
      # release-publish do not run. The step calls node, not `npm run`, so
      # that no npm output goes into GITHUB_OUTPUT. With `shell: bash`, a
      # failed script fails the pipe
      # (docs/solutions/workflow-issues/default-run-shell-hides-pipe-failures.md).
      - name: Release version
        id: version
        run: |
          mkdir -p "$RUNNER_TEMP/release-data"
          node scripts/release-version.ts "$RUNNER_TEMP/release-data/notes.md" | tee -a "$GITHUB_OUTPUT"

      # The changelog of the release: changelog.json for the builds and the
      # release assets, CHANGELOG.md for the release assets, and index.html
      # for GitHub Pages. The script fails when it cannot make the changelog,
      # because a release must have its changelog.
      - name: Release changelog
        if: steps.version.outputs.due == 'true'
        run: node scripts/changelog.ts write "$RUNNER_TEMP/release-data/changelog"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: steps.version.outputs.due == 'true'
        with:
          name: release-data
          path: ${{ runner.temp }}/release-data
          if-no-files-found: error
          retention-days: 7

  # Builds the macOS release, and signs and notarizes it (docs/releases.md).
  # It starts when the licence gate passes, at the same time as the checks;
  # release-publish publishes nothing unless the checks also pass. This job
  # can read the repository only (R25). Only the two release builds can read
  # the signing secrets: the `release` environment accepts only main. Each
  # secret goes only to the step that uses it. Every action is pinned by its
  # full commit SHA, because a moved tag must not get these secrets.
  release-build:
    name: Release build
    # The licence gate (licences, sources, bans) comes before any job that
    # holds a signing credential.
    needs: [deny, release-version]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.release-version.outputs.due == 'true'
    # Use only GitHub's runners or an ephemeral self-hosted runner: it gets
    # a new VM for each job, so the keychain and key files of this job do
    # not stay on it.
    runs-on: ${{ vars.MACOS_RELEASE_RUNNER || 'macos-latest' }}
    environment: release
    permissions:
      contents: read
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.release-version.outputs.version }}
    steps:
      # The job-level env cannot use the runner context, so this step sets
      # the temporary paths. rust-cache removes non-Cargo files from target
      # during cache save, so the NeMo cache is outside target.
      - name: Record the temporary paths
        run: |
          {
            echo "KEYCHAIN=$RUNNER_TEMP/release.keychain-db"
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8"
            echo "LONGHAND_NEMO_CACHE=$RUNNER_TEMP/longhand-nemo"
            echo "RELEASE_FILES=$RUNNER_TEMP/release"
          } >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/node-setup

      # The notes and the changelog of release-version. The build reads
      # changelog.json (LONGHAND_CHANGELOG).
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-data
          path: ${{ runner.temp }}/release-data

      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0

      # A release build has its own artifacts, so it has its own cache key.
      # It saves the cache only on success. A failed build would save a
      # partial cache under the exact key, and rust-cache never saves again
      # after an exact hit, so each later release would restore that partial
      # cache.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: v3-release
          cache-on-failure: false

      - uses: ./.github/actions/sccache-setup

      - name: Install frontend dependencies
        run: npm ci

      # The version goes into the build through a config file, not a commit
      # (KTD6). The config file also turns on the updater archive, so local
      # builds need no updater key.
      - name: Release config
        run: |
          jq -n --arg version "$VERSION" '{version: $version, bundle: {createUpdaterArtifacts: true}}' \
            > "$RUNNER_TEMP/release.json"

      # beforeBuildCommand signs the NeMo helper before Tauri's own
      # certificate import would run, so the certificate goes into a
      # temporary keychain first. Steps as in Handy's build.yml.
      - name: Import the Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          password=$(openssl rand -base64 24)
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$KEYCHAIN"
          security set-keychain-settings -t 7200 -u "$KEYCHAIN"
          security unlock-keychain -p "$password" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Developer ID Application" \
            || { echo "The certificate is not a Developer ID Application identity"; exit 1; }

      - name: Write the notarization key
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          umask 077
          printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$APPLE_API_KEY_PATH"

      # Tauri signs, notarizes and staples the app, then makes the updater
      # archive and its signature from the stapled app. LONGHAND_RELEASE
      # makes this build check for updates (KTD5). The transcribe-cpp build
      # reads TRANSCRIBE_CMAKE_ARGS. GGML_NATIVE=OFF builds the CPU code for
      # all Apple silicon, not for the CPU of the runner, so the app runs on
      # an M1 when the runner has a newer chip. LONGHAND_CHANGELOG puts the
      # changelog of this release into the binary (KTD4).
      - name: Tauri build (release, notarized)
        env:
          TRANSCRIBE_CMAKE_ARGS: -DGGML_NATIVE=OFF
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          LONGHAND_BUILD_COMMIT: ${{ github.sha }}
          LONGHAND_RELEASE: "1"
          LONGHAND_CHANGELOG: ${{ runner.temp }}/release-data/changelog/changelog.json
        run: npm run tauri -- build --bundles app,dmg --config "$RUNNER_TEMP/release.json"

      - name: Notarize and staple the DMG
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          dmg=$(ls target/release/bundle/dmg/*.dmg)
          xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" --wait --timeout 30m
          xcrun stapler staple "$dmg"
          echo "DMG=$dmg" >> "$GITHUB_ENV"

      - name: Check the signatures and the notarization
        run: |
          app=target/release/bundle/macos/Longhand.app
          codesign --verify --deep --strict "$app"
          xcrun stapler validate "$app"
          xcrun stapler validate "$DMG"
          spctl -a -vv "$app"
          spctl -a -vv -t open --context context:primary-signature "$DMG"
          test -s target/release/bundle/macos/Longhand.app.tar.gz.sig
          # Updater 2.14 and later refuses an update whose signature names a
          # version other than the version in latest.json.
          base64 -d < target/release/bundle/macos/Longhand.app.tar.gz.sig | tr '\t' '\n' \
            | grep -qxF "version:$VERSION" \
            || { echo "the updater signature does not name version $VERSION"; exit 1; }
          # The cache can keep older transcribe-cpp builds; the newest is this one.
          cache=$(ls -t target/release/build/transcribe-cpp-sys-*/out/build/CMakeCache.txt | head -n 1)
          grep -q '^GGML_NATIVE:BOOL=OFF$' "$cache" \
            || { echo "transcribe-cpp was built for the CPU of the runner: $cache"; exit 1; }

      # release-publish gets the files from this artifact and runs no build
      # code (R25). The DMG gets its fixed name here, so that the download
      # links of the website always find the newest DMG. The staple is in
      # the file, so the new name keeps it.
      - name: Collect the release files
        run: |
          mkdir -p "$RELEASE_FILES"
          cp "$DMG" "$RELEASE_FILES/Longhand_aarch64.dmg"
          cp target/release/bundle/macos/Longhand.app.tar.gz \
            target/release/bundle/macos/Longhand.app.tar.gz.sig "$RELEASE_FILES/"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-macos
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          retention-days: 7

      - name: Delete the keychain and the notarization key
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN" 2>/dev/null || true
          rm -f "$APPLE_API_KEY_PATH"

  # Builds the Windows installer of the release and signs it through Azure
  # Artifact Signing (docs/releases.md). It starts when the licence gate
  # passes, at the same time as the checks and the macOS release build;
  # release-publish publishes nothing unless every check and both builds
  # pass. It signs with a federated login from the release environment, so
  # no signing secret is stored in GitHub. Every action is pinned by its
  # full commit SHA.
  release-windows:
    name: Release build (Windows)
    # The licence gate comes before any job that holds a signing credential.
    needs: [deny, release-version]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.release-version.outputs.due == 'true'
    # A standard runner: free for a public repository, and clean, so a
    # published file does not depend on the state of a self-hosted runner.
    runs-on: windows-latest
    timeout-minutes: 120
    # The release environment allows deployments only from main, and the
    # Azure federated credential trusts only this environment (R13, KTD10).
    # id-token applies to the whole job, so each step can request the token
    # that Azure accepts for signing. This is the same trust as the macOS
    # release job, which compiles while it holds the Apple certificate
    # (KTD6).
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      CARGO_INCREMENTAL: 0
      VERSION: ${{ needs.release-version.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      # transcribe-cpp builds ggml from source; its deep paths need long-path
      # support on Windows (as Handy's CI enables it).
      - name: Enable long paths
        shell: pwsh
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
          git config --system core.longpaths true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The same setup as the Windows checks. A release build has
      # its own artifacts, so it has its own cache key. It saves the cache
      # only on success: a partial cache saved under the exact key is never
      # replaced, so each later release would restore it.
      - name: Windows build setup
        uses: ./.github/actions/windows-build-setup
        with:
          prefix-key: v3-release-windows
          cache-on-failure: false

      # After the Windows build setup, so that its post step runs before the
      # Dev Drive is removed.
      - uses: ./.github/actions/sccache-setup

      # rust-cache removes non-Cargo files from target during cache save,
      # so the NeMo cache goes in the temp folder. The version goes into the
      # build through a config file, not a commit (KTD6). The config file
      # also turns on the updater files and the sign command, so local
      # builds stay unsigned and need no updater key (KTD3). Tauri runs the
      # sign command for each file that it signs, with the file as %1.
      - name: Record the NeMo cache path and the release config
        env:
          WORKSPACE: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
        run: |
          echo "LONGHAND_NEMO_CACHE=$RUNNER_TEMP/longhand-nemo" >> "$GITHUB_ENV"
          script=$(cygpath -m "$WORKSPACE/scripts/windows-signing.ts")
          jq -n --arg version "$VERSION" --arg script "$script" '{
            version: $version,
            bundle: {
              createUpdaterArtifacts: true,
              windows: {signCommand: {cmd: "node", args: [$script, "sign", "%1"]}}
            }
          }' > "$RUNNER_TEMP/release.json"

      # As in the Windows checks, the helper is prepared in bash
      # before the Tauri build. Under pwsh, the Windows PowerShell child that
      # prepares the Vulkan runtime gets the PowerShell 7 module path, and
      # Get-FileHash does not load. This step sets LONGHAND_VULKAN_RUNTIME_DIR,
      # so the Tauri build does not start that child.
      - name: Build and stage NeMo helper
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
        run: node scripts/prepare-nemo.ts

      # The installer contains the same changelog as the macOS build of the
      # release (KTD7 of the monthly changelog plan), from release-version.
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-data
          path: ${{ runner.temp }}/release-data

      - name: Record the changelog path
        run: echo "LONGHAND_CHANGELOG=$RUNNER_TEMP/release-data/changelog/changelog.json" >> "$GITHUB_ENV"

      # The compile only. The bundle step comes after the Azure login, so a
      # long cold compile does not use up the login (KTD3). The release
      # config gives the version, which is compiled into the binary.
      # LONGHAND_RELEASE makes this build check for updates. The commit
      # shows in About. LONGHAND_CHANGELOG, from the step before, puts the
      # changelog of the release into the binary.
      - name: Tauri build (release, no bundle)
        shell: pwsh
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
        env:
          LONGHAND_BUILD_COMMIT: ${{ github.sha }}
          LONGHAND_RELEASE: "1"
        # PowerShell removes an unquoted `--` before npm.ps1 gets the
        # arguments, so npm reads the Tauri flags as its own. Quote it.
        run: |
          npm run tauri '--' build --no-bundle --config "$env:RUNNER_TEMP/release.json"
          if ($LASTEXITCODE -ne 0) { throw "Tauri build failed" }

      # A build with no release config reports version 0.1.0, and each
      # Windows app would see each release as newer than itself.
      - name: Check the version of the executable
        shell: pwsh
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
        run: |
          $actual = (Get-Item target/release/longhand.exe).VersionInfo.ProductVersion
          if ($actual -notmatch "^$([regex]::Escape($env:VERSION))(\.0)?$") {
            throw "longhand.exe has version $actual, not $env:VERSION"
          }
          Write-Output "longhand.exe has version $actual"

      # SignTool from the Windows SDK build tools, and the Artifact Signing
      # dlib, at pinned versions: the SDK on the runner image can be older
      # than the dlib needs (KTD4). The dlib signs in to Azure with the
      # Azure CLI login of the next step; metadata.json excludes the other
      # credential types, so no other source of credentials is tried.
      - name: Install SignTool and the Artifact Signing dlib
        shell: pwsh
        env:
          ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
        run: |
          $tools = Join-Path $env:RUNNER_TEMP signing
          nuget install Microsoft.Windows.SDK.BuildTools -Version 10.0.28000.2526 -OutputDirectory $tools -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw "nuget install failed" }
          nuget install Microsoft.ArtifactSigning.Client -Version 1.0.146 -OutputDirectory $tools -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw "nuget install failed" }
          $signtool = Join-Path $tools Microsoft.Windows.SDK.BuildTools.10.0.28000.2526/bin/10.0.28000.0/x64/signtool.exe
          $dlib = Join-Path $tools Microsoft.ArtifactSigning.Client.1.0.146/bin/x64/Azure.CodeSigning.Dlib.dll
          foreach ($file in $signtool, $dlib) {
            if (-not (Test-Path $file)) { throw "$file is missing" }
          }
          foreach ($name in 'ENDPOINT', 'ACCOUNT', 'PROFILE') {
            if (-not (Get-Item "env:$name").Value) { throw "The release environment has no value for $name" }
          }
          $metadata = Join-Path $tools metadata.json
          @{
            Endpoint = $env:ENDPOINT
            CodeSigningAccountName = $env:ACCOUNT
            CertificateProfileName = $env:PROFILE
            ExcludeCredentials = @(
              'EnvironmentCredential', 'WorkloadIdentityCredential', 'ManagedIdentityCredential',
              'SharedTokenCacheCredential', 'VisualStudioCredential', 'VisualStudioCodeCredential',
              'AzurePowerShellCredential', 'AzureDeveloperCliCredential', 'InteractiveBrowserCredential'
            )
          } | ConvertTo-Json | Set-Content -Encoding utf8 $metadata
          "LONGHAND_SIGNTOOL=$signtool" >> $env:GITHUB_ENV
          "LONGHAND_SIGNING_DLIB=$dlib" >> $env:GITHUB_ENV
          "LONGHAND_SIGNING_METADATA=$metadata" >> $env:GITHUB_ENV

      # A federated login: GitHub gives a token for the release
      # environment, and Azure trusts only that subject (KTD10).
      - name: Azure login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Tauri signs the executable, the resource .exe and .dll files, the
      # uninstaller and the installer, then writes the updater signature of
      # the signed installer (KTD3). Only this step gets the updater key.
      - name: Tauri bundle (Windows installer, signed)
        shell: pwsh
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm run tauri '--' bundle --bundles nsis --config "$env:RUNNER_TEMP/release.json"
          if ($LASTEXITCODE -ne 0) { throw "Tauri bundle failed" }

      # Updater 2.14 and later refuses an update whose signature names a
      # version other than the version in the manifest.
      - name: Check the updater signature
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
        run: |
          shopt -s nullglob
          installers=(target/release/bundle/nsis/*-setup.exe)
          if [ "${#installers[@]}" -ne 1 ]; then
            echo "expected one installer, found ${#installers[@]}"
            exit 1
          fi
          test -s "${installers[0]}.sig"
          # The whole text first: grep -q can stop reading before the end of
          # a pipe, and pipefail would then fail the step.
          comment=$(base64 -d < "${installers[0]}.sig" | tr '\t' '\n')
          grep -qxF "version:$VERSION" <<< "$comment" \
            || { echo "the updater signature does not name version $VERSION"; exit 1; }
          echo "INSTALLER=$(cygpath -m "$PWD/${installers[0]}")" >> "$GITHUB_ENV"

      # The signature gate (KTD5): a silent install into a temporary folder,
      # then a check of every .exe and .dll there and of the installer. A
      # failure leaves no artifact, so nothing publishes.
      - name: Install the installer silently
        shell: pwsh
        run: |
          $folder = Join-Path $env:RUNNER_TEMP longhand-install
          $install = Start-Process -FilePath $env:INSTALLER -ArgumentList '/S', "/D=$folder" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "The silent install failed with exit code $($install.ExitCode)" }

      # In bash, not pwsh: a Windows PowerShell child of pwsh gets the
      # PowerShell 7 module path, and the script reads the signatures with
      # Windows PowerShell (see the NeMo helper step).
      - name: Check the signatures of the installed files
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
        env:
          WINDOWS_PUBLISHER: ${{ vars.WINDOWS_PUBLISHER }}
        run: node scripts/windows-signing.ts verify "$RUNNER_TEMP/longhand-install" "$INSTALLER"

      # release-publish gets the files from this artifact. The installer gets
      # its fixed name here, after the signature gate, so that the download
      # links of the website always find the newest installer. The
      # Authenticode signature is in the file, and the updater checks only
      # the signature and the version of the .sig, so the new name keeps
      # both.
      - name: Collect the release files
        run: |
          mkdir -p "$RUNNER_TEMP/release-windows"
          cp "$INSTALLER" "$RUNNER_TEMP/release-windows/Longhand_x64-setup.exe"
          cp "$INSTALLER.sig" "$RUNNER_TEMP/release-windows/Longhand_x64-setup.exe.sig"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-windows
          path: ${{ runner.temp }}/release-windows
          if-no-files-found: error
          retention-days: 7

  # Publishes the built release with the files of both platforms. It runs
  # only when every check, the licence gate and both release builds pass, so
  # a release has both platforms or does not publish. It is the only job in
  # this workflow that can write to the repository, and it runs no build
  # code: no package install and no cargo, only the publish script, which
  # uses only Node's built-in modules (R25). It needs no secrets, so it has
  # no environment.
  release-publish:
    name: Release publish
    needs: [checks, deny, release-version, release-build, release-windows]
    if: needs.release-version.outputs.due == 'true'
    runs-on: ubuntu-latest
    # actions: read lets the publish step find a newer CI run on main.
    permissions:
      contents: write
      actions: read
    timeout-minutes: 15
    # changelog-pages runs only when this job published a release.
    outputs:
      published: ${{ steps.publish.outputs.published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Node only: this job runs no npm. No package cache, so the job that
      # can write to the repository restores nothing that a PR wrote.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          package-manager-cache: false

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-data
          path: ${{ runner.temp }}/release-data

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-macos
          path: ${{ runner.temp }}/release-macos

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-windows
          path: ${{ runner.temp }}/release-windows

      # The script prints `published=<true|false>` for GITHUB_OUTPUT and
      # writes its other lines to stderr. With `shell: bash`, a failed script
      # fails the pipe
      # (docs/solutions/workflow-issues/default-run-shell-hides-pipe-failures.md).
      - name: Publish
        id: publish
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release-version.outputs.version }}
        run: |
          data="$RUNNER_TEMP/release-data"
          mac="$RUNNER_TEMP/release-macos"
          win="$RUNNER_TEMP/release-windows"
          node scripts/publish-release.ts publish "$VERSION" \
            "$mac/Longhand_aarch64.dmg" "$mac/Longhand.app.tar.gz" "$mac/Longhand.app.tar.gz.sig" \
            "$win/Longhand_x64-setup.exe" "$win/Longhand_x64-setup.exe.sig" \
            "$data/notes.md" "$data/changelog/changelog.json" "$data/changelog/CHANGELOG.md" \
            | tee -a "$GITHUB_OUTPUT"

  # Finds whether a push to main changed the website (site/, scripts/site.ts,
  # scripts/lib/changelog.ts, this file or the node-setup action), so that
  # changelog-pages also deploys a page change, or a fix to a failed deploy,
  # when no release is due (landing page plan, KTD2).
  site-changed:
    name: Site changed
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.site.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: site
        env:
          BASE: ${{ github.event.before }}
        run: scripts/site-changed.sh "$BASE" >> "$GITHUB_OUTPUT"

  # Deploys the website to GitHub Pages: the landing page at the root and
  # the changelog page at /changelog/ (KTD6 of the monthly changelog plan,
  # KTD2 of the landing page plan). It runs when release-publish published a
  # release, or when the push changed the website, the checks passed and no
  # release is due. When a release is due, the site deploys only with that
  # release, so the download links of the page always find their files.
  # Without a release it makes the changelog page from the changelog.json of
  # the latest release. The condition starts with !cancelled(), because the
  # release jobs are skipped when no release is due, and a skipped need
  # otherwise skips this job. The site-only path also needs a successful
  # release-version job: a failed job leaves `due` empty, which is not "no
  # release due". A failed deploy does not fail the CI run, because the run
  # of a published release must not show as failed. The workflow-level
  # concurrency group runs the CI runs on main one at a time, so an older
  # deploy cannot replace a newer site.
  changelog-pages:
    name: Website
    needs: [checks, deny, release-version, release-publish, site-changed]
    if: >-
      ${{ !cancelled() && (needs.release-publish.outputs.published == 'true' ||
      (needs.site-changed.outputs.changed == 'true' && needs.checks.result == 'success' &&
      needs.deny.result == 'success' && needs.release-version.result == 'success' &&
      needs.release-version.outputs.due != 'true')) }}
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # scripts/site.ts builds the site with Vite, so the job needs the npm
      # packages. npm ci needs the npm version that devEngines gives, which
      # no Node release includes, so the job uses the same setup as the
      # other jobs. It restores no package cache.
      - uses: ./.github/actions/node-setup

      - name: Install npm packages
        run: npm ci

      - if: needs.release-publish.outputs.published == 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-data
          path: ${{ runner.temp }}/release-data

      # The changelog of the published release, or else of the latest release.
      - name: Published release changelog
        if: needs.release-publish.outputs.published == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/changelog"
          cp "$RUNNER_TEMP/release-data/changelog/changelog.json" "$RUNNER_TEMP/changelog/"

      - name: Latest release changelog
        if: needs.release-publish.outputs.published != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: gh release download --repo "$REPOSITORY" --pattern changelog.json --dir "$RUNNER_TEMP/changelog"

      - name: Make the site
        run: node scripts/site.ts "$RUNNER_TEMP/changelog/changelog.json" "$RUNNER_TEMP/site"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ${{ runner.temp }}/site

      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
