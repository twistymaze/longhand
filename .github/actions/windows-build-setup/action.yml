name: Windows build setup
description: >-
  Sets up a Windows runner to build Longhand: the Dev Drive, the Vulkan SDK,
  the Rust toolchain, the Rust cache, MSVC, SPIRV-Headers, Node and npm with
  the frontend dependencies, and the VC++ runtime dirs. The CI checks and the
  release installer use this one definition, so they build the same way.
  The caller enables long paths before the checkout, and runs this action
  after the checkout.

inputs:
  prefix-key:
    description: The rust-cache prefix key. A build with different artifacts needs its own key.
    required: true
  cache-on-failure:
    description: >-
      Save the rust-cache when a later step fails. The checks use true, so
      a job that has never passed still gets a cache. A release build uses
      false, because it runs only after the checks pass, and a partial cache
      saved under the exact key is never replaced.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    # A Dev Drive (ReFS on a VHDX) makes the build's many small reads and
    # writes faster than NTFS on the runner's disk. A trusted Dev Drive also
    # stops Defender from scanning each file. The workspace, the target dir,
    # CARGO_HOME and RUSTUP_HOME all move onto it, so the steps that build
    # run in DEV_DRIVE_WORKSPACE. The drive is dynamic: the size is a limit,
    # and the VHDX takes only the space that the build writes. This step
    # must come before rust-cache: post steps run in reverse order, so
    # rust-cache saves the cache before this action dismounts the drive.
    # The self-hosted runner has a permanent Dev Drive that holds its work folder.
    # The drive mounts at a fixed folder, not at the next free drive letter:
    # the larger runner of main gets D: and windows-latest gets E:, because
    # its D: is the temp disk. The rust-cache key includes CARGO_HOME and
    # RUSTUP_HOME, and the sccache keys of Rust crates include the source
    # paths. With different paths, pull requests (windows-latest) never
    # restored the caches that main (the larger runner) saved.
    - name: Set up a Dev Drive
      if: runner.environment == 'github-hosted'
      uses: samypr100/setup-dev-drive@562171fe8df7401fdf582d766cd3b6ab80d5b1a0 # v4
      with:
        drive-size: 40GB
        mount-path: C:/devdrive
        workspace-copy: true
        trusted-dev-drive: true
        env-mapping: |
          CARGO_HOME,{{ DEV_DRIVE }}/.cargo
          RUSTUP_HOME,{{ DEV_DRIVE }}/.rustup

    # actions/cache stores a path outside the workspace relative to the
    # workspace (../../../devdrive/...), and it extracts relative to the
    # workspace. The workspace is on C: on the larger runner of main but on
    # D: on windows-latest, so there a restore wrote main's caches to
    # D:\devdrive, and the build did not find them. A junction from the
    # workspace drive's \devdrive to C:\devdrive sends the restore to the
    # Dev Drive. This step must come before rust-cache.
    - name: Link the Dev Drive folder on the workspace drive
      if: runner.environment == 'github-hosted'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $drive = Split-Path -Qualifier $env:GITHUB_WORKSPACE
        if ($drive -ne 'C:') {
          New-Item -ItemType Junction -Path "$drive\devdrive" -Target 'C:\devdrive' | Out-Null
          Write-Output "$drive\devdrive -> C:\devdrive"
        }

    # The Windows x64 build links ggml's Vulkan backend (KTD6), which needs
    # the SDK's headers and glslc at build time. Version as Handy pins it.
    # The action's own cache holds only the installer, which downloads in
    # seconds, and it runs on the deprecated Node 20 `actions/cache@v4`.
    # The self-hosted runner's image has the same SDK version and sets VULKAN_SDK.
    # The action installs into VULKAN_SDK when it is set, else into the
    # checkout. The checkout is C:\a on the larger runner of main but D:\a
    # on windows-latest. The CMake builds record the SDK path, so the SDK
    # goes on the Dev Drive, which has the same path on each runner type.
    - name: Install Vulkan SDK
      if: runner.environment == 'github-hosted'
      uses: humbletim/install-vulkan-sdk@30ba978f977e81b72d091fc8888feb1fb26f9aff # v1.2
      env:
        VULKAN_SDK: C:/devdrive/VULKAN_SDK
      with:
        version: 1.4.309.0
        cache: false

    - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
      with:
        components: rustfmt, clippy

    # Line tables give file and line numbers in backtraces. Full debug
    # info makes each link of the test binaries and the app much slower.
    - name: Line tables only in debug builds
      if: runner.environment == 'github-hosted'
      shell: bash
      run: echo "CARGO_PROFILE_DEV_DEBUG=line-tables-only" >> "$GITHUB_ENV"

    # Saved even when a later step fails (unless the caller sets
    # cache-on-failure to false): otherwise a job that has never
    # passed never gets a cache, and every run compiles ggml, ONNX Runtime
    # and SQLite from scratch. The key follows Cargo.lock and the CMake
    # toolchain file (sccache-setup), and an exact hit is never saved again, so a change to how CI builds (flags,
    # profiles, which cargo commands run) needs `prefix-key` bumped or its
    # new artifacts are never cached. A self-hosted runner skips this: its target/
    # stays from the last job, and a cache save would prune it.
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      if: runner.environment == 'github-hosted'
      with:
        prefix-key: ${{ inputs.prefix-key }}
        key: cmake-${{ hashFiles('.github/actions/sccache-setup/msvc-toolchain.cmake') }}
        cache-on-failure: ${{ inputs.cache-on-failure }}
        workspaces: ${{ env.DEV_DRIVE_WORKSPACE || '.' }}

    # The MSVC environment makes Rust select link.exe from PATH, where Git
    # Bash can put its own link.exe first. So the caller's Rust steps use
    # `shell: pwsh`:
    # https://github.com/ilammy/msvc-dev-cmd#name-conflicts-with-shell-bash
    - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

    # ggml-vulkan does `find_package(SPIRV-Headers CONFIG REQUIRED)`, and the
    # SDK install exposes no findable SPIRV-HeadersConfig.cmake. The step
    # installs the header-only package from the SPIRV-Headers commit of the
    # Vulkan SDK version above (tag vulkan-sdk-1.4.309.0) and puts it on
    # CMAKE_PREFIX_PATH. CMake with Ninja needs the MSVC environment, so the
    # step comes after it. This takes a few seconds; vcpkg took about 40 s.
    # The CMake builds record CMAKE_PREFIX_PATH, so on GitHub's runners the
    # package goes on the Dev Drive, not in RUNNER_TEMP (C:\a\_temp or
    # D:\a\_temp, as the runner type sets).
    - name: Install SPIRV-Headers
      shell: bash
      run: |
        base="${DEV_DRIVE:-$RUNNER_TEMP}"
        src="$base/spirv-headers-src"
        prefix="$(cygpath -m "$base/spirv-headers")"
        rm -rf "$src"
        git init -q "$src"
        git -C "$src" fetch -q --depth 1 https://github.com/KhronosGroup/SPIRV-Headers 09913f088a1197aba4aefd300a876b2ebbaa3391
        git -C "$src" checkout -q FETCH_HEAD
        cmake -S "$src" -B "$src/build" -G Ninja -DCMAKE_INSTALL_PREFIX="$prefix" \
          -DSPIRV_HEADERS_ENABLE_TESTS=OFF -DSPIRV_HEADERS_ENABLE_INSTALL=ON
        cmake --install "$src/build"
        echo "CMAKE_PREFIX_PATH=$prefix${CMAKE_PREFIX_PATH:+;$CMAKE_PREFIX_PATH}" >> "$GITHUB_ENV"

    # The two Windows runners share one VM user. node-setup installs npm
    # into the job's own temp folder, so a job never replaces a file that a
    # job on the other runner runs
    # (docs/solutions/build-errors/setup-bun-ebusy-on-shared-windows-runner.md).
    - uses: ./.github/actions/node-setup

    - name: Install frontend dependencies
      shell: bash
      working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
      run: npm ci

    # The installer carries the VC++ runtime app-local, so Longhand starts
    # on a machine without a current redistributable. build.rs stages the
    # DLLs from these dirs, taken from the Visual Studio install that
    # compiled the native code, as Handy's CI does.
    - name: Locate the VC++ runtime
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $vsRoot = & $vswhere -latest -products * -property installationPath
        if (-not $vsRoot) { throw "vswhere found no Visual Studio installation" }
        $version = (Get-Content (Join-Path $vsRoot "VC\Auxiliary\Build\Microsoft.VCRedistVersion.default.txt")).Trim()
        $archDir = Join-Path $vsRoot "VC\Redist\MSVC\$version\x64"
        $crt = Get-ChildItem $archDir -Directory -Filter "Microsoft.VC*.CRT" | Sort-Object Name | Select-Object -Last 1
        if (-not $crt -or -not (Test-Path (Join-Path $crt.FullName "msvcp140.dll"))) {
          throw "VC++ CRT redist not found under $archDir"
        }
        $dirs = $crt.FullName
        $omp = Get-ChildItem $archDir -Directory -Filter "Microsoft.VC*.OpenMP" | Sort-Object Name | Select-Object -Last 1
        if ($omp) { $dirs = "$dirs;$($omp.FullName)" }
        Add-Content -Path $env:GITHUB_ENV -Value "LONGHAND_VC_REDIST_DIRS=$dirs"
