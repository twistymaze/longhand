[package]
name = "pipeline"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
aec = { path = "../aec" }
asr = { path = "../asr" }
audio-sync = { path = "../audio-sync" }
diarize = { path = "../diarize" }
recorder = { path = "../recorder" }
session-save = { path = "../session-save" }
session-core = { path = "../session-core" }
chrono = "0.4"
hound = "3.5.1"
log.workspace = true
ogg = "0.9.2"
opus = "0.4.0"
# The multistream calls of the libopus that `opus` links (KTD7).
opusic-sys = "0.7.5"
rubato = "0.16"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tokio-util = "0.7"
summarize = { path = "../summarize" }

[dev-dependencies]
realfft = "3.5.0"
tempfile = "3"
serde_json.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "io-util"] }
