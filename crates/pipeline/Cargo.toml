[package]
name = "pipeline"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
models = { path = "../models" }
nemo-runtime = { path = "../nemo-runtime" }
power = { path = "../power" }
asr = { path = "../asr" }
audio = { path = "../audio" }
# The copy, the hash and the decode of an imported file.
audio-import = { path = "../audio-import" }
# The shared import record of the storage folder (KTD2).
import-record = { path = "../import-record" }
diarize = { path = "../diarize" }
# The refresh step that every writer runs first (KTD3, KTD8).
library = { path = "../library" }
recorder = { path = "../recorder" }
session-save = { path = "../session-save" }
session-core = { path = "../session-core" }
chrono = "0.4"
hound = "3.5.1"
log.workspace = true
ogg = "0.9.2"
opus = "0.4.0"
# The multistream calls of the libopus that `opus` links (KTD7).
opusic-sys = "0.7.5"
rubato = "0.16"
sha2 = "0.10"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tempfile = "3"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tokio-util = "0.7"
# The id of an imported note, as capture makes it.
uuid.workspace = true
summarize = { path = "../summarize" }

[dev-dependencies]
pyannote-local = { path = "../pyannote-local" }
realfft = "3.5.0"
serde_json.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "io-util"] }
