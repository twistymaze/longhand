[package]
name = "models"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
futures-util = "0.3"
log.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["stream", "native-tls"] }
specta = { workspace = true, features = ["derive"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true
tokio = { version = "1", features = ["fs", "rt", "time", "macros"] }
tokio-util = "0.7"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["fs", "rt", "time", "macros", "net", "io-util", "rt-multi-thread"] }
