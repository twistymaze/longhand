[package]
name = "audio-mock"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
audio = { path = "../audio" }
futures-util = "0.3"
hound = "3.5.1"
log.workspace = true
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
