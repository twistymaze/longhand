[package]
name = "audio-import"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
log.workspace = true
sha2 = "0.10"
thiserror.workspace = true
# Pure-Rust decoders for m4a and qta (AAC-LC), mp3 and wav (KTD1). MPL-2.0: deny.toml
# and about.toml accept it for the Symphonia crates only.
symphonia = { version = "0.6.1", default-features = false, features = ["aac", "isomp4", "mp3", "wav", "pcm", "id3v2"] }

[dev-dependencies]
tempfile = "3"
