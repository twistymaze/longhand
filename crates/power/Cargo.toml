[package]
name = "power"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# Library only: the default-off `bin` feature pulls the CLI.
keepawake = { version = "0.6.1", default-features = false }
log.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSNotification", "NSString"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWorkspace"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Power", "Win32_UI_WindowsAndMessaging"] }
