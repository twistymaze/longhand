[package]
name = "note-tools"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# The read-only note tools (KTD2). One definition of each tool serves the
# summary agent, the harness and a later CLI or MCP server. This crate has
# no Rig, Tauri or pipeline dependency.

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
library = { path = "../library" }
regex = "1"
schemars = "1"
serde.workspace = true
serde_json.workspace = true
session-core = { path = "../session-core" }
session-save = { path = "../session-save" }
thiserror.workspace = true

[dev-dependencies]
tempfile = "3"
