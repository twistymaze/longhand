[package]
name = "asr"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
session-core = { path = "../session-core" }
log.workspace = true
serde.workspace = true
thiserror.workspace = true
vad = { path = "../vad" }

[target.'cfg(target_os = "macos")'.dependencies]
transcribe-cpp = { version = "0.4.1", default-features = false, features = ["metal"] }

[target.'cfg(all(windows, target_arch = "x86_64"))'.dependencies]
transcribe-cpp = { version = "0.4.1", default-features = false, features = ["dynamic-backends", "vulkan"] }

[target.'cfg(not(any(target_os = "macos", all(windows, target_arch = "x86_64"))))'.dependencies]
transcribe-cpp = { version = "0.4.1", default-features = false }

[dev-dependencies]
serde_json.workspace = true
hound = "3.5.1"
models = { path = "../models" }
