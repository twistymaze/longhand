[package]
name = "library"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
log.workspace = true
serde_json.workspace = true
session-core = { path = "../session-core" }
session-save = { path = "../session-save" }
thiserror.workspace = true

[dev-dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
# The two-computer tests save notes through the real save stage (KTD8).
pipeline = { path = "../pipeline" }
# The recognition settings of a Transcribe Again run.
models = { path = "../models" }
# The settings file and the prompt files of the test storage folder.
shared-settings = { path = "../shared-settings" }
# The built-in prompts that the skill copies.
summarize = { path = "../summarize" }
tempfile = "3"
