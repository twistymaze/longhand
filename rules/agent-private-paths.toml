family = "agent-private-paths"
rule = "Never commit, print or upload a private, gitignored path."
state = "enforced"
enforced_by = "node .claude/hooks/rules.mjs (Claude Code PreToolUse hook)"
lessons = ["CLAUDE.md"]

# Codex does not run Claude Code hooks; for Codex the rule stays as text in CLAUDE.md.
[[negative]]
apply = "rules/negatives/agent-private-paths.patch"
run = "node .claude/hooks/rules.mjs < rules/negatives/agent-private-paths-input.json"
expect = "agent-private-paths: This path is private"
