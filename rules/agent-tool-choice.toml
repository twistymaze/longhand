family = "agent-tool-choice"
rule = "Use Python only through uv and JavaScript packages only through npm, and do not run prettier."
state = "enforced"
enforced_by = "node .claude/hooks/rules.mjs (Claude Code PreToolUse hook)"
lessons = ["CLAUDE.md"]

# Codex does not run Claude Code hooks; for Codex the rule stays as text in CLAUDE.md.
[[negative]]
apply = "rules/negatives/agent-tool-choice.patch"
run = "node .claude/hooks/rules.mjs < rules/negatives/agent-tool-choice-input.json"
expect = "agent-tool-choice: Use Python only through uv"
