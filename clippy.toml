# Calls that go around a shared function. Each reason names the function to
# use. rules/ records each ban as a mistake family with a negative example.
disallowed-methods = [
  { path = "session_save::rename::Fs::rename_new", reason = "Use session_save::rename::rename_new_waiting: it waits while another app holds the folder, and it decides a new name only with is_name_taken (rules/rename-waits.toml)." },
  { path = "ort::session::Session::builder", reason = "Build each ONNX session through session_builder in crates/onnx: it keeps the session on CPU unless the caller adds Core ML (rules/ort-cpu-builder.toml)." },
]
