# Licence gate for everything linked into the binary (Implementation Constraints).
# LGPL, GPL and MPL fail the build; the allow-list is the whole policy.
#
# The allow-list holds permissive licences: they ask at most for a notice.
# When a new dependency brings a licence of that kind, add it to the list
# (and to `accepted` in about.toml). Public domain (CC0-1.0) is even more
# permissive than the rest. A per-crate exception below is only for a
# licence that asks for more, such as MPL-2.0.

[graph]
all-features = false
# Check only the platforms that Longhand ships. The same two targets are in
# scripts/licences/generate.ts. Crates that only other platforms use, such as
# tauri's Linux GTK stack, are not shipped, so their advisories and licences
# do not apply.
targets = ["aarch64-apple-darwin", "x86_64-pc-windows-msvc"]

# Known vulnerabilities, unmaintained and unsound crates, and yanked versions
# (RustSec). The scheduled advisory workflow and each PR that changes
# dependencies run this check. Only the maintainer adds an ignore, and each
# ignore has a reason (docs/upkeep/README.md).
[advisories]
yanked = "deny"
# Report an unmaintained crate only when a Longhand crate uses it directly.
# An unmaintained crate deeper in the graph has no fix that Longhand can make.
unmaintained = "workspace"
ignore = []

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
]
confidence-threshold = 0.9

# MPL-2.0 is file-level copyleft and arrives only through Tauri itself: Servo's
# CSS parser (via tauri-utils and wry) and `dirs`. Tauri cannot be built without
# them, so each is excepted by name; an MPL crate anywhere else still fails.
# Unmodified MPL files ship with their source available upstream, which is all
# the licence asks of a binary distribution.
exceptions = [
  { crate = "cssparser", allow = ["MPL-2.0"] },
  { crate = "cssparser-macros", allow = ["MPL-2.0"] },
  { crate = "dtoa-short", allow = ["MPL-2.0"] },
  { crate = "selectors", allow = ["MPL-2.0"] },
  { crate = "option-ext", allow = ["MPL-2.0"] },
  # A permissive data licence on Mozilla's root certificates, which reach the
  # graph only as a build dependency of ort-sys (its ONNX Runtime download);
  # nothing of it is linked into the binary.
  { crate = "webpki-root-certs", allow = ["CDLA-Permissive-2.0"] },
]

# Workspace crates are unpublished and carry no licence field of their own.
[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# No git dependencies: every crate comes from crates.io (Implementation Constraints).
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
